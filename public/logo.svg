<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Kub-loggan i favicon-looken (app/icon.png) — samma pixel-samplade
       gradienter som Mark i components/site.tsx så alla ytor matchar. -->
  <defs>
    <linearGradient id="fpmk-top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FC7E26"/>
      <stop offset="1" stop-color="#FF9838"/>
    </linearGradient>
    <linearGradient id="fpmk-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4210"/>
      <stop offset="1" stop-color="#FA3A0B"/>
    </linearGradient>
    <linearGradient id="fpmk-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF852B"/>
      <stop offset="1" stop-color="#FF6B1E"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="48" fill="#ffffff"/>
  <g transform="translate(48,48) scale(6)">
    <polygon points="12,1 21.6,6.5 12,12.1 2.4,6.5" fill="url(#fpmk-top)"/>
    <polygon points="2.4,6.5 12,12.1 12,23 2.4,17.3" fill="url(#fpmk-left)"/>
    <polygon points="21.6,6.5 12,12.1 12,23 21.6,17.3" fill="url(#fpmk-right)"/>
  </g>
</svg>
