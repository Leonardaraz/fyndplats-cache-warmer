<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .title { font-size: 12px; color: #444; margin-bottom: 8px; }
      .variant { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
      .variant label { flex: 1; }
      .cost { color: #888; }
      button { width: 100%; padding: 8px; margin-top: 10px; font-size: 13px; cursor: pointer; }
      #status { font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
      .warn { color: #b25000; }
      .ok { color: #1a7f37; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Fyndplats Import</h1>
    <div id="title" class="title">Läser produkt…</div>
    <div id="variants"></div>
    <button id="import" disabled>Importera valda varianter</button>
    <button id="orders">Öppna orderläge</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
