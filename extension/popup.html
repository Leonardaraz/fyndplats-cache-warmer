<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .title { font-size: 12px; color: #444; margin-bottom: 8px; }
      .variant { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
      .variant label { flex: 1; }
      .cost { color: #888; }
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 10px;
        margin-left: 4px;
        white-space: nowrap;
      }
      .badge-eu { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
      .badge-cn { background: #fef3c7; color: #78350f; border: 1px solid #fcd34d; }
      .badge-unknown { background: #e5e7eb; color: #4b5563; border: 1px solid #d1d5db; }
      .summary-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        margin-left: 6px;
      }
      button { width: 100%; padding: 8px; margin-top: 10px; font-size: 13px; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      #status { font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
      .warn { color: #b25000; }
      .ok { color: #1a7f37; }
      .err { color: #b00020; }
      .eu-toggle {
        display: flex; align-items: center; gap: 10px;
        background: linear-gradient(90deg, #fff3e9, #ffe9d6);
        border: 1px solid #ffd2ad; border-radius: 10px;
        padding: 10px; margin-bottom: 10px;
      }
      .eu-text { flex: 1; }
      .eu-title { font-size: 13px; font-weight: 700; color: #6b3b00; }
      .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 auto; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; cursor: pointer; inset: 0; background: #ccc;
        border-radius: 24px; transition: 0.2s;
      }
      .slider::before {
        content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px;
        background: #fff; border-radius: 50%; transition: 0.2s;
      }
      .switch input:checked + .slider { background: #ff6a00; }
      .switch input:checked + .slider::before { transform: translateX(18px); }
      details.settings { margin-top: 12px; border-top: 1px solid #eee; padding-top: 8px; }
      details.settings summary { font-size: 12px; font-weight: 600; cursor: pointer; color: #444; }
      .feature { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
      .feature label { flex: 1; }
      .feature .hint { color: #888; font-size: 10px; }
    </style>
  </head>
  <body>
    <h1>Fyndplats Import</h1>

    <div class="eu-toggle">
      <label class="switch">
        <input type="checkbox" id="euOnly" />
        <span class="slider"></span>
      </label>
      <div class="eu-text">
        <div class="eu-title">🇪🇺 EU-lager-läge</div>
        <div class="hint">Visar & bulk-importerar bara produkter från EU-lager på AliExpress sök-/kategorisidor. Sätt på, sök sedan som vanligt.</div>
      </div>
    </div>

    <div id="title" class="title">Läser produkt…</div>
    <div id="variants"></div>
    <button id="import" disabled>Importera valda varianter</button>
    <button id="orders">Öppna orderläge</button>
    <div id="status"></div>

    <details class="settings">
      <summary>⚙️ Inställningar (AI-funktioner)</summary>
      <div class="feature">
        <input type="checkbox" id="f-translate" />
        <label for="f-translate">Översätt namn + beskrivning <span class="hint">(Claude)</span></label>
      </div>
      <div class="feature">
        <input type="checkbox" id="f-seo" />
        <label for="f-seo">SEO-optimering <span class="hint">(Claude)</span></label>
      </div>
      <div class="feature">
        <input type="checkbox" id="f-imageAnalysis" />
        <label for="f-imageAnalysis">Bild-analys <span class="hint">(Claude vision)</span></label>
      </div>
      <div class="feature">
        <input type="checkbox" id="f-autoCategorize" />
        <label for="f-autoCategorize">Auto-kategorisering <span class="hint">(Claude)</span></label>
      </div>
      <div class="hint" style="margin-top:4px">Avmarkera för snabbare import och lägre AI-kostnad.</div>
    </details>

    <script src="eu-countries.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
