name: VEVOR — importen

# VEVOR-importens läge, strömbrytare och provkörning (lib/vevor/import.ts).
# Läsarens avläsningar i lager blir osynliga utkast i Wix.
#
#   status  läget och antalen: avläsningar i lager, produkter i Wix mot taket,
#           rabatten (bara satt/saknas), föräldralösa, senaste körningen
#   prov    en körning för hand med högst `max` utkast, torr om inte `skarp`
#           är ja. Går även när importen är avstängd.
#   pa      schemat (var femte minut) börjar importera, så fort Wix tar emot
#   av      schemat slutar importera; utkasten står kvar
#
# Ordningen första gången: status, prov torrt, prov skarpt med max 5, granska
# utkasten i Wix, sedan pa. En omkörning skapar inga nya utkast.
#
# Skriver bara antal, tider och Wix-id. Svaren bär inga artikelnummer,
# adresser, priser eller rabattnivåer, och repot är publikt.
#
# ⚠️ Rutterna finns bara där de är deployade. Kör från main när de ligger där.

on:
  workflow_dispatch:
    inputs:
      lage:
        description: "status, prov, pa eller av"
        required: true
        default: status
        type: choice
        options: [status, prov, pa, av]
      max:
        description: "Högst så många utkast i läget prov (1–50)"
        required: false
        default: "5"
      skarp:
        description: "Läget prov: ja skapar utkasten i Wix, nej räknar bara"
        required: false
        default: "nej"
        type: choice
        options: ["nej", "ja"]

jobs:
  kor:
    runs-on: ubuntu-latest
    steps:
      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LAGE: ${{ inputs.lage }}
          MAX: ${{ inputs.max }}
          SKARP: ${{ inputs.skarp }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # Till STDERR: en ::error::-rad på stdout slukas av kommandosubstitutionen.
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi
          rot="${BASE%/api/cron/poll-tracking}"

          case "$LAGE" in
            status)
              svar=$(curl -sS --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "${rot}/api/admin/vevor-import") || {
                echo "::error::Anropet gick inte fram" >&2; exit 1; }
              ;;
            prov)
              if ! [[ "$MAX" =~ ^[0-9]+$ ]] || [ "$MAX" -lt 1 ] || [ "$MAX" -gt 50 ]; then
                echo "::error::max ska vara ett heltal mellan 1 och 50" >&2; exit 1
              fi
              torr="true"
              if [ "$SKARP" = "ja" ]; then torr="false"; fi
              svar=$(curl -sS --max-time 320 -H "Authorization: Bearer ${CRON_SECRET}" \
                "${rot}/api/cron/vevor-import?manuell=1&max=${MAX}&dryRun=${torr}") || {
                echo "::error::Anropet gick inte fram" >&2; exit 1; }
              ;;
            pa|av)
              svar=$(curl -sS --max-time 90 -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
                -H "Content-Type: application/json" -d "{\"atgard\":\"${LAGE}\"}" "${rot}/api/admin/vevor-import") || {
                echo "::error::Anropet gick inte fram" >&2; exit 1; }
              ;;
            *)
              echo "::error::okänt läge" >&2; exit 1
              ;;
          esac

          if ! echo "$svar" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::Svaret var inte JSON. Är rutten deployad där workflowen kör?" >&2
            exit 1
          fi
          if [ "$(echo "$svar" | jq -r '.ok')" != "true" ]; then
            echo "::error::$(echo "$svar" | jq -r '.error // "okänt fel"')" >&2
            exit 1
          fi

          # Bara antal, tider, skäl och Wix-id. Markören och rabatten står aldrig i svaret.
          case "$LAGE" in
            prov)
              echo "$svar" | jq '{utfall, skal, dryRun, granskade, importerade, redanImporterade, hinder, fel, foraldralosa, bilder, medicinteknik, gpsr, produkterIWix, varvKlart, stoppadAv}' || true
              utfall=$(echo "$svar" | jq -r '.utfall')
              if [ "$(echo "$svar" | jq -r '.foraldralosa | length')" != "0" ]; then
                echo "::error::Produkter skapades utan mappningsrad. Wix-id står ovan." >&2
                exit 1
              fi
              if [ "$utfall" != "klar" ]; then
                echo "::error::Körningen slutade som ${utfall}: $(echo "$svar" | jq -r '.skal // ""')" >&2
                exit 1
              fi
              ;;
            *)
              echo "$svar" | jq '{aktiv, markor, varvImporterade, vilaTill, foraldralosa, stoppIFoljd, larmAt, rabatt, lasarenFryst, antal, senasteKorning}' || true
              ;;
          esac
