name: Bilder — fler bilder till en färg på en sammanslagen Aosom-sida

# Leonard 2026-10-21: färgval som visar fyra bilder eller färre ska få fler bilder
# ur leverantörens egen uppsättning, länkade till rätt färg. Mätt samma dag: 502
# av 628 sidor med ett sådant val är Aosom-sidor med en artikel per färg.
# Logiken och skälen: lib/aosom/fargtillagg.ts.
#
#   kandidater     Laddar upp feedens begärda positioner (standard 3, 8, 9, 10) för
#                  varje färgs artikel till Media Manager, utan att röra produkten.
#                  `mal` är wix-id (alla färger som visar få bilder) eller
#                  wix-id:val-id (just den färgen). Torrkörning utan `skarp`.
#   plan           Läser tillagg.json ur grenen och räknar vad en skrivning gör.
#                  Skriver ingenting. Ger planens sha.
#   skriv          Kräver bekrafta = planens sha. Planen räknas om ur färska läsningar;
#                  har något ändrats skrivs ingenting.
#   plan_och_skriv Planen och skrivningen i omgångar om högst 25 sidor, utan att en
#                  sidas färger delas. Första fel stoppar allt.
#
# tillagg.json (i tools/polish-assets/<runda>/), en människa har tittat på varje fil:
#   { "sidor": [ { "id": "<wix-id>", "val": "<val-id>",
#                  "bilder": [ { "fil": "<Wix fil-id>", "alt": "Svensk alt-text" } ] } ] }
# `alt` kan utelämnas; då byggs "<sidans namn> i färgen <färg>, bild N".
#
# ☠️ EN MÄNNISKA TITTAR PÅ VARJE KANDIDAT. 46 procent av feedens bilder bär tysk text
#    inbränd, och en logotyp eller ett märke syns inte i någon grind. Verktyget
#    väljer aldrig bilder. Adresserna i loggen är Wix egna (wixstatic) och publika.
# ☠️ GODKÄNDA KANDIDATER MÅSTE SKRIVAS INOM TRE DYGN. Nattens bildstädning tar varje
#    Aosom-fil som varit oanvänd så länge (lib/store/bildstadning-karens.ts).
# ☠️ KÖR plan/skriv MED `ref` SATT TILL GRENEN SOM HAR tillagg.json. Default är main.
#    Kontrollen av sha256 fäller en körning mot fel gren innan något skrivs.
# ☠️ LOGGEN ÄR PUBLIK. Svaret bär bara wix-id, val-id, färgnamn, Wix egna fil-id och
#    adresser, räknare och hinderkoder — aldrig artikelnummer eller leverantörens adresser.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "kandidater · plan · skriv · plan_och_skriv"
        required: true
        default: "kandidater"
        type: choice
        options:
          - kandidater
          - plan
          - skriv
          - plan_och_skriv
      mal:
        description: "kandidater: wix-id eller wix-id:val-id, kommaseparerade (en sida = alla färger som visar få bilder)."
        required: false
        default: ""
        type: string
      positioner:
        description: "kandidater: feedens positioner, kommaseparerade (tomt = 3,8,9,10)."
        required: false
        default: ""
        type: string
      hogst_bilder:
        description: "kandidater: en färg som visar så här många bilder eller färre tas med när målet är en hel sida (tomt = 4)."
        required: false
        default: ""
        type: string
      skarp:
        description: "kandidater: ladda upp på riktigt (annars torrkörning)."
        required: false
        default: false
        type: boolean
      runda:
        description: "plan/skriv: katalogen under tools/polish-assets som har tillagg.json"
        required: false
        default: ""
        type: string
      plan_sha256:
        description: "plan/skriv: sha256 av tillagg.json (sha256sum skriver ut den)"
        required: false
        default: ""
        type: string
      bekrafta:
        description: "skriv: planens sha (64 hextecken) från en plan med EXAKT samma tillagg.json."
        required: false
        default: ""
        type: string

concurrency:
  # Samma grupp som poleringens skrivningar: två skrivningar mot samma butik
  # samtidigt ger revisionskonflikter.
  group: polish-write
  cancel-in-progress: false

jobs:
  tillagg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Ett wix-id är publikt, men ett artikelnummer som klistrats i fel fält hade
      # stått i nästa stegs env-block. Maskeras i ett EGET steg, och värdet läses
      # ur händelsen, inte via ett uttryck.
      - name: Maskera
        run: |
          jq -r '[.inputs.mal, .inputs.positioner, .inputs.hogst_bilder, .inputs.runda] | map(. // "") | join("\n")' "$GITHUB_EVENT_PATH" \
            | perl -ne 'print "::add-mask::$1\n" while /\b((?:\d{2}[A-Z]|[A-Z]\d{2}|\d[A-Z]\d|\d{3})-\d{3}(?!\d)[A-Z0-9]*)\b/gi'
          exit 0

      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          MAL: ${{ inputs.mal }}
          POSITIONER: ${{ inputs.positioner }}
          HOGST_BILDER: ${{ inputs.hogst_bilder }}
          SKARP: ${{ inputs.skarp }}
          RUNDA: ${{ inputs.runda }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          BEKRAFTA: ${{ inputs.bekrafta }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # TILL STDERR -- en ::error::-rad pa stdout slukas av en
            # kommandosubstitution.
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi
          url="${BASE%/api/cron/poll-tracking}/api/admin/aosom-fargtillagg"
          kropp="${RUNNER_TEMP}/kropp.json"

          # Kroppen ligger i en fil: en plan med manga sidor ryms inte i en
          # argumentlista (2026-10-01: "Argument list too long").
          posta() {
            curl -sS -w '\n%{http_code}' --max-time 295 -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data-binary @"${kropp}" "${url}"
          }
          avbryt() {
            echo "::error::HTTP ${1}: $(printf '%s' "$2" | jq -r '.error // "se Vercel-loggen"' 2>/dev/null || echo "se Vercel-loggen")" >&2
            exit 1
          }
          lista() { printf '%s' "$1" | tr ';\t\r\n' ',,,,' | tr -d ' ' | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -sc .; }

          # -- kandidater: varv tills alla mal ar tagna --
          if [ "${MODE}" = "kandidater" ]; then
            alla="$(lista "${MAL:-}")"
            if [ "$(printf '%s' "$alla" | jq 'length')" = "0" ]; then
              echo "::error::mal saknas" >&2
              exit 1
            fi
            pos="$(lista "${POSITIONER:-}")"
            hogst="$(printf '%s' "${HOGST_BILDER:-}" | tr -d ' ')"
            if [ -n "$hogst" ] && ! printf '%s' "$hogst" | grep -Eq '^[0-9]{1,2}$'; then
              echo "::error::hogst_bilder ska vara ett heltal 0-20" >&2
              exit 1
            fi
            # Rutten tar hogst 50 mal per anrop; resten vantar i en ko.
            ko="$(printf '%s' "$alla" | jq -c '.[50:]')"
            kvar="$(printf '%s' "$alla" | jq -c '.[:50]')"
            torr=true
            if [ "${SKARP}" = "true" ]; then torr=false; fi
            uppladdade=0
            missar=0
            {
              echo "### Fargtillagg — kandidater$(if [ "$torr" = "true" ]; then echo " (torrkorning)"; fi)"
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for varv in $(seq 1 40); do
              jq -nc --argjson mal "$kvar" --argjson torr "$torr" --argjson pos "$pos" --arg hogst "$hogst" '
                {lage: "kandidater", mal: $mal, dryRun: $torr}
                + (if ($pos | length) > 0 then {positioner: $pos} else {} end)
                + (if $hogst != "" then {hogstBilder: ($hogst | tonumber)} else {} end)' > "${kropp}"
              svar="$(posta)"
              kod="$(printf '%s' "$svar" | tail -n1)"
              body="$(printf '%s' "$svar" | sed '$d')"
              if [ "$kod" != "200" ]; then avbryt "$kod" "$body"; fi
              printf '%s\n' "$body" | jq -r '
                .rader[] |
                (if .val then "\(.id):\(.val)" else .id end) as $n |
                if .hinder then "HINDER \($n) \(.hinder)"
                else
                  "FARG \($n) \(.namn // "?") nuvarande \(.nuvarande // "-") finns \((.finns // []) | map(tostring) | join(",")) hamta \((.attHamta // []) | map(tostring) | join(","))\(if (.okandaKallor // 0) > 0 then " okanda_kallor \(.okandaKallor)" else "" end)\(if (.missar | length) > 0 then " MISS \(.missar | map(tostring) | join(","))" else "" end)",
                  (.kandidater[]? | "KAND \($n) pos \(.pos) \(.fileId) \(.url)")
                end
              ' | tee -a "$GITHUB_STEP_SUMMARY"
              uppladdade=$((uppladdade + $(printf '%s' "$body" | jq '.uppladdade')))
              missar=$((missar + $(printf '%s' "$body" | jq '.missar')))
              kvar="$(printf '%s' "$body" | jq -c '.kvar')"
              if [ "$(printf '%s' "$kvar" | jq 'length')" = "0" ]; then
                if [ "$(printf '%s' "$ko" | jq 'length')" = "0" ]; then break; fi
                kvar="$(printf '%s' "$ko" | jq -c '.[:50]')"
                ko="$(printf '%s' "$ko" | jq -c '.[50:]')"
              fi
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Uppladdade: ${uppladdade} · missar: ${missar} · kvar: $(printf '%s' "$kvar" | jq 'length')" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(printf '%s' "$kvar" | jq 'length')" != "0" ]; then
              echo "::error::Varven tog slut med mal kvar — kor om med dem" >&2
              exit 1
            fi
            if [ "$missar" != "0" ]; then echo "::warning::${missar} bilder gick inte att ladda upp"; fi
            exit 0
          fi

          # -- plan, skriv, plan_och_skriv: filen ur grenen --
          if ! printf '%s' "${RUNDA}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,80}$'; then
            echo "::error::runda ska vara ett katalognamn under tools/polish-assets" >&2
            exit 1
          fi
          if ! printf '%s' "${PLAN_SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::plan_sha256 ska vara 64 hextecken" >&2
            exit 1
          fi
          fil="tools/polish-assets/${RUNDA}/tillagg.json"
          if [ ! -f "${fil}" ]; then
            echo "::error::${fil} finns inte på ${GITHUB_REF_NAME} — kör mot grenen som har filen, inte main" >&2
            exit 1
          fi
          faktisk=$(sha256sum "${fil}" | cut -d' ' -f1)
          if [ "${faktisk}" != "${PLAN_SHA256}" ]; then
            echo "::error::tillagg.json på ${GITHUB_REF_NAME} har sha256 ${faktisk}, inte den angivna. Fel gren, eller en fil som ändrats efter pushen? Ingenting skrivet." >&2
            exit 1
          fi
          sidor="$(jq '[.sidor[].id] | unique | length' "${fil}")"
          farger="$(jq '.sidor | length' "${fil}")"
          if [ "${farger}" = "0" ]; then
            echo "::error::${fil} har inga färger att skriva" >&2
            exit 1
          fi
          echo "Fil: ${fil} (${sidor} sidor, ${farger} färger), ${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}, läge ${MODE}"

          # En omgång: högst 25 sidor, och en sidas färger delas aldrig.
          jq -c '[.sidor | group_by(.id)[]] | [range(0; length; 25) as $i | .[$i:$i+25] | add]' "${fil}" > "${RUNNER_TEMP}/omgangar.json"
          antal="$(jq 'length' "${RUNNER_TEMP}/omgangar.json")"
          if [ "${MODE}" != "plan_och_skriv" ] && [ "${antal}" != "1" ]; then
            echo "::error::Filen har ${sidor} sidor — plan och skriv tar högst 25. Använd plan_och_skriv." >&2
            exit 1
          fi

          # Sammanfattningen av en plan eller skrivning, samma form i alla lägen.
          visa() {
            printf '%s\n' "$1" | jq -r '
              if .produkter then
                "sidor \(.produkter | length), andras \(.skrivbara)\(if .lage == "skriv" then ", skrivna \(.skrivna), stopp \(.stoppadAv)" else "" end)",
                "sha \(.sha)",
                (.produkter[] | "  \(.id): galleri \(.bilderFore) -> \(.bilderEfter), lankar \(.lankarAndras)\(if .hinder then ", HINDER \(.hinder)" else "" end)",
                  (.atgarder[] | "    \(.val // "sida") \(.typ) kalla \(.kalla)\(if .hinder then " HINDER \(.hinder)" else "" end)")),
                (.utfall[]? | "  skriv \(.id): \(if .ok then "ok" else "FEL" end) \(.steg | join(" | ")) \(.fel // "")"),
                (if (.kvar | length) > 0 then "KVAR (tidsbudgeten) \(.kvar | join(","))" else empty end)
              else empty end
            ' || true
          }

          skrivna=0
          for i in $(seq 0 $((antal - 1))); do
            omg="$(jq -c --argjson i "$i" '.[$i]' "${RUNNER_TEMP}/omgangar.json")"
            echo "== omgång $((i + 1)) av ${antal}: $(printf '%s' "$omg" | jq '[.[].id] | unique | length') sidor"
            if [ "${MODE}" = "skriv" ]; then
              if ! printf '%s' "${BEKRAFTA:-}" | grep -Eq '^[0-9a-f]{64}$'; then
                echo "::error::skriv kraver bekrafta = planens sha (kor plan forst)" >&2
                exit 1
              fi
              sha="${BEKRAFTA}"
            else
              printf '%s' "$omg" | jq -c '{lage: "plan", sidor: .}' > "${kropp}"
              svar="$(posta)"
              kod="$(printf '%s' "$svar" | tail -n1)"; body="$(printf '%s' "$svar" | sed '$d')"
              visa "$body"
              if [ "$kod" != "200" ]; then avbryt "$kod" "$body"; fi
              sha="$(printf '%s' "$body" | jq -r '.sha')"
              {
                echo "### Fargtillagg — plan, omgång $((i + 1))"
                echo ""
                printf '%s\n' "$body" | jq -r '
                  "**sha:** `\(.sha)` · sidor \(.produkter | length) · andras \(.skrivbara)",
                  "",
                  "| wix-id | galleri fore → efter | lankar | atgarder | hinder |",
                  "|---|---|---:|---|---|",
                  (.produkter[] | "| `\(.id)` | \(.bilderFore) → \(.bilderEfter) | \(.lankarAndras) | \([.atgarder[] | "\(.val // "sida") \(.typ) \(.kalla)\(if .hinder then " HINDER \(.hinder)" else "" end)"] | join("; ")) | \(.hinder // "") |")
                ' || true
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "${MODE}" = "plan" ]; then
                echo "> Skriv: kör mode=skriv med samma runda och plan_sha256 och bekrafta=${sha}" >> "$GITHUB_STEP_SUMMARY"
                echo "Planens sha: ${sha}"
                exit 0
              fi
              if [ "$(printf '%s' "$body" | jq '.skrivbara')" = "0" ]; then continue; fi
            fi
            printf '%s' "$omg" | jq -c --arg sha "$sha" '{lage: "skriv", sidor: ., bekrafta: $sha}' > "${kropp}"
            svar="$(posta)"
            kod="$(printf '%s' "$svar" | tail -n1)"; body="$(printf '%s' "$svar" | sed '$d')"
            visa "$body"
            {
              echo "### Fargtillagg — skriv, omgång $((i + 1))"
              echo ""
              printf '%s\n' "$body" | jq -r '
                if .lage == "skriv" and .utfall then
                  "**Skrivna: \(.skrivna), stopp: \(.stoppadAv)\(if (.kvar | length) > 0 then ", kvar: \(.kvar | join(" "))" else "" end)**",
                  "",
                  (.utfall[] | "- `\(.id)` \(if .ok then "ok" else "FEL" end): \(.steg | join(" · "))\(if .fel then " — \(.fel)" else "" end)")
                else empty end
              ' || true
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$kod" != "200" ]; then avbryt "$kod" "$body"; fi
            n="$(printf '%s' "$body" | jq '.skrivna // 0')"
            skrivna=$((skrivna + n))
            if [ "$(printf '%s' "$body" | jq '(.utfall // []) | map(select(.ok | not)) | length')" != "0" ] \
              || [ "$(printf '%s' "$body" | jq '(.kvar // []) | length')" != "0" ]; then
              echo "::error::Omgång $((i + 1)) stannade — kör om resten" >&2
              echo "Skrivna sidor totalt: ${skrivna}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "Skrivna sidor totalt: ${skrivna}" | tee -a "$GITHUB_STEP_SUMMARY"
