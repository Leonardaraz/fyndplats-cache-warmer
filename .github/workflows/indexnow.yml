name: IndexNow daily ping

# Pingar IndexNow för produkter som ändrats senaste ~48h (publiceringar,
# SEO-poleringar) så Google/Bing m.fl. crawlar dem snabbt. Daglig ryggrad
# utöver de event-drivna pingarna vid import/publicering — täcker även
# manuella poleringar gjorda direkt mot Wix-API:t.
#
# Krävs som repository secret (Settings → Secrets and variables → Actions):
#   INDEXNOW_CRON_URL — fullständig URL, t.ex.
#       https://fyndplats-cache-warmer.vercel.app/api/cron/indexnow
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Pinga ALLA synliga produkter (inte bara senaste 48h)"
        required: false
        default: "false"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger indexnow endpoint
        run: |
          url="${{ secrets.INDEXNOW_CRON_URL }}"
          if [ "${{ github.event.inputs.all }}" = "true" ]; then url="${url}?all=1"; fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$url")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::IndexNow endpoint returned non-200 status"
            exit 1
          fi
