# Fyndauktionen: fyll/uppdatera auktionspoolen ur hela katalogen.
# Manuell körning (Actions → auction-seed → Run workflow). Kör först utan
# apply för en torrkörning, granska rapporten i loggen, kör sedan med apply.
name: auction-seed

#
# SCHEMA (2026-09-28): varje natt 03:17 UTC (05:17 sommartid, 04:17 vintertid),
# med apply. Kön och morgondagens fem (främjade kl 19, start 07) får då
# butikens aktuella pris. Utan schemat gick poolen en månad utan körning:
# fyra av dagens fem låg ~10 % under butikens pris, och katalogens nya
# produkter kom aldrig med. Actions-cron kan landa upp till en timme sent,
# därför långt före 07.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Skriv ändringar (annars torrkörning)"
        type: boolean
        default: false
      force:
        description: "Skriv även om många köade fynd tas bort (skyddsräcket)"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anropa seed-endpointen
        run: |
          APPLY=""
          if [ "${{ inputs.apply }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then APPLY="?apply=1"; fi
          if [ -n "$APPLY" ] && [ "${{ inputs.force }}" = "true" ]; then APPLY="${APPLY}&force=1"; fi
          curl --fail-with-body --max-time 300 -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fyndplats-cache-warmer.vercel.app/api/cron/auction-seed${APPLY}" | tee seed-report.json
          # ok:false bakom HTTP 200 (t.ex. skyddsräcket) ska göra körningen röd.
          if grep -q '"ok":false' seed-report.json; then
            echo "::error::Seeden rapporterade ok:false — se rapporten ovan"
            exit 1
          fi
      - name: Spara rapporten som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-report
          path: seed-report.json
