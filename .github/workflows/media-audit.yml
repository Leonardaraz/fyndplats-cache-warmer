name: Bilder — inventera mediabiblioteket

# Samma upplägg som prisreparationen: produktionen har Wix-nycklarna, GitHub
# Actions har CRON_SECRET, och de möts här. Ingen hemlighet passerar chatten.
#
# ETT LÄGE: torrkörning. Rutten kan inte skriva och kan inte radera.
# Rapporten läggs i grenen som tools/media-audit/scan-latest.json.
#
# Varför den finns: mediabiblioteket hade 30 231 bilder 2026-08-27. Ett
# filobjekt är ~1,3 kB, så en full listning är ~39 MB — den ryms inte i en
# chattsession. Här är samma jobb ~170 API-anrop.
#
# LÄS RAPPORTEN RÄTT: "utan katalogreferens" betyder att ingen produkt och
# ingen kategori pekar på filen. Det betyder INTE att den är oanvänd — sidor,
# banners, logotyper, bloggen och CMS-kollektioner syns inte i den här
# mätningen, och Wix har inget API som svarar på var en fil används.
#
# Återanvänder befintliga repository secrets:
#   POLL_TRACKING_URL — bas-URL:en härleds härifrån (byter path-suffix)
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "Site att inventera (tomt = butikens headless-site)"
        required: false
        default: ""
        type: string
      full_id_list:
        description: "Ta med hela id-listan i rapporten (annars bara de 200 största)"
        required: false
        default: false
        type: boolean
      max_seconds:
        description: "Tidsbudget i sekunder (ruttens tak är 300)"
        required: false
        default: "240"
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Kör
        env:
          # VIA MILJÖN, inte via ${{ }} inuti skriptet — samma skäl som i
          # price-repair.yml: interpolation i bash är en injektionsväg.
          SITE_ID: ${{ inputs.site_id }}
          FULL_IDS: ${{ inputs.full_id_list }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          set -euo pipefail
          base="${{ secrets.POLL_TRACKING_URL }}"
          base="${base%/api/cron/poll-tracking}/api/cron/media-audit"

          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          mkdir -p tools/media-audit

          q="maxSeconds=${MAX_SECONDS}"
          if [ -n "$SITE_ID" ]; then
            q="${q}&siteId=$(printf '%s' "$SITE_ID" | jq -sRr @uri)"
          fi
          if [ "$FULL_IDS" = "true" ]; then
            q="${q}&ids=1"
          fi

          body=$(curl -sS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${base}?${q}")
          ok=$(printf '%s' "$body" | jq -r '.ok // false')
          if [ "$ok" != "true" ]; then
            echo "::error::Inventeringen misslyckades: $(printf '%s' "$body" | head -c 400)"
            exit 1
          fi

          printf '%s' "$body" | jq '.' > tools/media-audit/scan-latest.json

          totalt=$(printf '%s' "$body" | jq -r '.filerTotalt')
          lasta=$(printf '%s' "$body" | jq -r '.filerLasta')
          produkter=$(printf '%s' "$body" | jq -r '.produkter')
          utan=$(printf '%s' "$body" | jq -r '.utanKatalogreferens')
          mb=$(printf '%s' "$body" | jq -r '.mbUtanReferens')
          dub=$(printf '%s' "$body" | jq -r '.dubblettgrupper')
          mbdub=$(printf '%s' "$body" | jq -r '.mbIDubbletter')
          full=$(printf '%s' "$body" | jq -r '.fullstandig')

          {
            echo "### Mediainventering"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Bildfiler totalt | **$totalt** (lästa: $lasta) |"
            echo "| Produkter genomsökta | $produkter |"
            echo "| Utan katalogreferens | **$utan** · $mb MB |"
            echo "| Byte-identiska dubbletter | $dub grupper · $mbdub MB |"
            echo "| Fullständig körning | $full |"
            echo ""
            echo "> \"Utan katalogreferens\" betyder att ingen produkt och ingen kategori pekar på filen."
            echo "> Det betyder INTE oanvänd: sidor, banners, logotyper, blogg och CMS-kollektioner"
            echo "> syns inte i mätningen. Radera inget utan att först titta på bilderna."
            echo ""
            echo "De 20 största utan referens:"
            echo ""
            echo '```'
            printf '%s' "$body" | jq -r '.storsta[:20][] | "\(.mb) MB  \(.displayName)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git add tools/media-audit/scan-latest.json
          if git diff --cached --quiet; then
            echo "Rapporten oförändrad sedan förra körningen."
          else
            git commit -m "Mediainventering: $utan bilder utan katalogreferens ($mb MB)"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
