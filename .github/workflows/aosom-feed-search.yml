name: Aosom — sök i feeden

# Svarar på "finns den här varan hos Aosom?" — hela feeden, inte bara den
# importerade delen av katalogen.
#
# Byggd 2026-09-03 efter order 10027: en AliExpress-vara gick inte att skicka
# till Sverige, och frågan blev om vi kunde köpa samma sak hos Aosom i stället.
# Det gick inte att svara på. Katalogen har bara den importerade delen (~4 500
# av 5 566 skeppningsbara rader), så "jag hittar ingen" betydde i praktiken
# "jag har inte kunnat titta överallt".
#
# ☠️ Feed-adressen bär våra INKÖPSPRISER och får aldrig passera en terminal
# eller en chatt. Produktionen har adressen, Actions har CRON_SECRET, och de
# möts i workflowen — samma nyckel-lösa upplägg som prisreparationen. Svaret
# innehåller bara träffarna.
#
# Rutten kan inte skriva. Det finns ingen "importera träffarna"-flagga med
# flit: vilken artikel som ska in är en människas bedömning.

on:
  workflow_dispatch:
    inputs:
      q:
        description: "Sökord — ALLA måste finnas. T.ex. '24 paneel gehege'"
        required: true
        type: string
      alla_rader:
        description: "Ta med rader som INTE går att skicka till Sverige"
        required: false
        default: false
        type: boolean
      # ☠️ `visa_pris` ÄR BORTTAGEN (2026-09-27). Den skrev inköpspriset bredvid
      # artikelnumret till den publika loggen — och användes ändå: 29 av 53
      # sparade körningar bar sådana rader, flera av dem efter att flaggan
      # infördes som "undantag". Priset finns i kuvertet.
      kuvert:
        # ☠️ SAMMA KANAL SOM I polish-mapping.yml, OCH AV SAMMA SKAL.
        #
        # `visa_pris` ar inget alternativ nar man bara vill VETA vad en vara
        # kostar oss: den skriver inkopspriset bredvid artikelnumret till en
        # logg som vem som helst kan lasa utan inloggning. Det ar ordagrant det
        # par som motiverar att feed-adressen ar hemlig.
        #
        # Fram till nu fanns bara tva vagar till feedens pris: den publika
        # loggen, eller ingen alls. Den har ar den tredje. Anroparen skickar en
        # ENGANGS PUBLIK nyckel; workflowen krypterar traffarnas prisfalt mot
        # den och skriver bara chiffret. Att den publika nyckeln syns i loggen
        # ar hela poangen med asymmetrisk kryptering — bara den privata
        # nyckeln, som aldrig lamnar anroparens maskin, oppnar kuvertet.
        #
        # Fragan som byggde den har (2026-09-10): stammer feedens varupris med
        # Aosoms B2B-kassa? Det gar inte att svara pa utan att lasa BELOPPET,
        # och beloppet far inte publiceras.
        description: "Base64-kodad RSA-publik nyckel (PEM/DER). Priserna krypteras mot den i stallet for att loggas."
        required: false
        default: ""
        type: string

jobs:
  sok:
    runs-on: ubuntu-latest
    steps:
      # ☠️ MASKERA FÖRST, I ETT EGET STEG. En fråga som ÄR ett artikelnummer
      # hade annars stått i nästa stegs env-block (`Q:`) och i "Fraga:"-raden.
      # Bara artikelnummerformade ord maskeras — att maskera "sofa" hade gjort
      # varje produktnamn oläsligt. Värdet läses ur händelsen, inte via `env:`.
      - name: Maskera
        run: |
          jq -r '.inputs.q // ""' "$GITHUB_EVENT_PATH" \
            | perl -ne 'print "::add-mask::$1\n" while /\b((?:\d{2}[A-Z]|[A-Z]\d{2}|\d[A-Z]\d|\d{3})-\d{3}(?!\d)[A-Z0-9]*)\b/gi'
          exit 0

      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          Q: ${{ inputs.q }}
          ALLA: ${{ inputs.alla_rader }}
          KUVERT: ${{ inputs.kuvert }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # ☠️ TILL STDERR. En ::error::-rad pa stdout slukas av
            # kommandosubstitutionen nedan.
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi

          url="${BASE%/api/cron/poll-tracking}/api/admin/aosom-feed-search"
          extra=""
          [ "${ALLA}" = "true" ] && extra="&allaRader=1"

          svar=$(curl -sS --get --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --data-urlencode "q=${Q}" \
            "${url}?dummy=1${extra}")

          if [ "$(echo "$svar" | jq -r '.ok')" != "true" ]; then
            echo "::error::$(echo "$svar" | jq -r '.error // "okant fel"')" >&2
            exit 1
          fi

          # ☠️ HELA jq-PROGRAMMET MÅSTE LIGGA INDENTERAT. En rad som börjar i
          # kolumn 1 avslutar YAML:ens `run: |`-block, och då kan GitHub inte
          # läsa filen — workflowen registreras aldrig och går inte att starta.
          # Radbrytningar skrivs därför som \n, inte som verkliga rader.
          echo "$svar" | jq -r '"Fraga: \(.fraga)\nRader i feeden: \(.raderILista)\nTraffar: \(.traffar)\(if .kapad then " (kapad till \(.visade|length))" else "" end)\n"'
          # ☠️ LOGGEN BÄR NAMN OCH SALDO — ALDRIG ARTIKELNUMMER, URL ELLER PRIS.
          #
          # 2026-09-07 togs priset bort ur standardutskriften men artikel-
          # numret och Aosoms produkt-URL stod kvar, med motiveringen att de
          # svarar på "finns varan". Uppmätt 2026-09-27 över 53 sparade
          # körningar: 42 bar artikelnummer och 29 bar dessutom inköpspriset
          # bredvid (`visa_pris`). URL:en bär numret den också. Numret är den
          # sträng som kopplar vår sida till Aosoms och dealproffsens — samma
          # skäl som gör feed-adressen hemlig.
          #
          # "Finns varan och finns saldo" besvaras av namnet och saldot. Vilken
          # artikel det är, var den ligger och vad den kostar oss står i
          # kuvertet nedan — krypterat mot anroparens engångsnyckel.
          # Namnet är fritext från feeden och kan bära en modellkod — samma
          # redigering som felraderna i import- och synkworkflowen.
          echo "$svar" | jq -r '.visade | to_entries[] | "  \(.key + 1). \(.value.namn)\n     saldo \(.value.saldo)\(if .value.skeppbarTillSe == false then " (skickas inte till Sverige)" else "" end)\n"' \
            | perl -pe 's/\b(?:\d{2}[A-Z]|[A-Z]\d{2}|\d[A-Z]\d|\d{3})-\d{3}(?!\d)[A-Z0-9]*\b/‹REDIGERAT›/g'
          if [ -z "${KUVERT:-}" ]; then
            echo "(artikelnummer, länk och pris skrivs inte ut — loggen är publik. Skicka en kuvert-nyckel för dem.)"
          fi

          # --- Kuvertet: prisfalten, krypterade i stallet for loggade ---
          if [ -n "${KUVERT:-}" ]; then
            echo
            echo "=== Kuvert (hybrid: AES-256-CBC + RSA-OAEP/SHA-256, base64) ==="

            # ☠️ Klartexten skrivs till en FIL, aldrig till en variabel som
            # nagot senare kan `echo`:a av misstag.
            umask 077
            echo "$svar" | jq -j '{
              fraga:   .fraga,
              traffar: .traffar,
              rader: [.visade[] | {sku, namn, grossistEur, seFraktEur, landatSek, fraktandel, saldo, viktKg, url}]
            } | tostring' > kuvert.klartext

            if ! echo "${KUVERT}" | base64 -d > kuvert.pub 2>/dev/null; then
              echo "::error::kuvert: inputet ar inte giltig base64" >&2
              exit 1
            fi

            # ☠️ HYBRID, INTE RAK RSA. En 2048-bitars nyckel rymmer 190 byte med
            # OAEP/SHA-256. En enda traff med namn och URL ar redan over det, och
            # femtio traffar ar en storleksordning over. polish-mapping.yml foll
            # pa exakt det ("data too large for key size") for att testet kordes
            # mot en kortare nyttolast an verkligheten.
            #
            # Losenordet ligger i en FIL, aldrig i argv: kommandoraden ar last av
            # vem som helst som kan lista processer.
            openssl rand -base64 32 > kuvert.losen

            # ☠️ OPENSSL:S FEL SYNS. Ett `2>/dev/null` har gor ett misslyckande
            # orsakslost. Felraderna beskriver nycklar och padding, aldrig
            # innehallet.
            if ! openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:kuvert.losen \
                 -in kuvert.klartext -out kuvert.data 2>kuvert.fel; then
              echo "::error::kuvert: AES-steget misslyckades — inget skrivs ut" >&2
              cat kuvert.fel >&2
              rm -f kuvert.klartext kuvert.pub kuvert.losen kuvert.data kuvert.fel
              exit 1
            fi

            # ☠️ INGEN FALLBACK TILL KLARTEXT. Gar nagot fel ska jobbet FALLA,
            # inte skriva ut vardet "sa att det atminstone syns".
            if ! openssl pkeyutl -encrypt -pubin -inkey kuvert.pub \
                 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
                 -in kuvert.losen -out kuvert.losen.enc 2>kuvert.fel; then
              echo "::error::kuvert: RSA-steget misslyckades — inget skrivs ut" >&2
              cat kuvert.fel >&2
              rm -f kuvert.klartext kuvert.pub kuvert.losen kuvert.losen.enc kuvert.data kuvert.fel
              exit 1
            fi
            rm -f kuvert.klartext kuvert.pub kuvert.losen kuvert.fel

            echo "losen: $(base64 -w0 kuvert.losen.enc)"
            echo "data:  $(base64 -w0 kuvert.data)"
            rm -f kuvert.losen.enc kuvert.data
            echo "(dekryptera: RSA-oppna losen med din privata nyckel, sedan"
            echo " openssl enc -d -aes-256-cbc -pbkdf2 -pass file:<losen> pa data)"
          fi

          if [ "$(echo "$svar" | jq -r '.traffar')" = "0" ]; then
            echo "Inga traffar. Prova farre eller bredare termer — sokningen kraver att ALLA ord finns."
          fi
