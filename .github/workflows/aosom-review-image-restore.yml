name: Recensioner — återställ raderade kundfoton (Aosom)

# Läser en JSON-fil ur grenen ({"rader": [{productId, reviewIdAE,
# sourceImageUrls}]}) och skickar den i omgångar till
# /api/cron/aosom-review-image-restore, som laddar upp källfotona från Aosoms CDN
# och skriver dem på raden först när Wix bekräftat att filen är klar. Bara
# Aosom-rader — AliExpress har review-image-restore.yml (#686). Se
# lib/reviews/aosom-image-restore.ts för reglerna.
#
# Filen bär produkt-id, recensions-id och leverantörens bildadresser — ALDRIG
# texter, namn eller artikelnummer (grenen är publik och raderas efteråt).
#
# ☠️ LOGGEN BÄR BARA RÄKNARE.
#
# Återanvänder repository secrets: POLL_TRACKING_URL (bas-URL) och CRON_SECRET.

on:
  workflow_dispatch:
    inputs:
      payload_file:
        description: "Sökväg i grenen till JSON-filen — kör workflowen på den gren filen ligger i"
        required: true
        type: string
      skarp:
        description: "ja = ladda upp och skriv. nej = torrkörning (räknar bara)."
        required: false
        default: "nej"
        type: choice
        options:
          - "nej"
          - "ja"
      omgang:
        description: "Rader per anrop"
        required: false
        default: "25"
        type: string

jobs:
  aosom-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Återställ
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIL: ${{ inputs.payload_file }}
          SKARP: ${{ inputs.skarp }}
          OMGANG: ${{ inputs.omgang }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi
          if [ ! -f "$FIL" ]; then
            echo "::error::Filen finns inte i grenen: $FIL" >&2
            exit 1
          fi
          # ☠️ Filen får inte bära artikelnummer. Stoppa hellre än att skicka.
          if jq -r '.. | strings' "$FIL" | grep -Eq '\b[0-9A-Z]{3}-[0-9]{3}(V[0-9]{2})?[A-Z]{2}\b'; then
            echo "::error::Filen ser ut att innehålla artikelnummer — vägrar" >&2
            exit 1
          fi

          url="${BASE%/api/cron/poll-tracking}/api/cron/aosom-review-image-restore"
          dry="true"
          [ "${SKARP:-nej}" = "ja" ] && dry="false"
          n="$(jq -r '.rader | length' "$FIL")"
          steg="${OMGANG:-25}"
          [ "$steg" -gt 200 ] && steg=200
          echo "$n rader i filen, $steg per anrop, skarp=${SKARP:-nej}"

          nycklar="behandlade saknarRad inteSynlig redanOk okandStatus kanAterstallas fotonAttHamta aterstallda fotonAterstallda fotoMissar misslyckade fel"
          declare -A tot
          for k in $nycklar; do tot[$k]=0; done

          i=0
          while [ "$i" -lt "$n" ]; do
            kropp="$(jq -c --argjson i "$i" --argjson s "$steg" --argjson dry "$dry" \
              '{dryRun: $dry, fromIndex: 0, limit: $s, rader: .rader[$i:($i+$s)]}' "$FIL")"
            svar="$(curl -sS -w '\n%{http_code}' --max-time 310 \
              -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" \
              --data-binary "$kropp" "$url")"
            kod="$(printf '%s' "$svar" | tail -n1)"
            json="$(printf '%s' "$svar" | sed '$d')"
            if [ "$kod" != "200" ]; then
              echo "::error::HTTP ${kod} vid rad ${i}" >&2
              printf '%s\n' "$json" | jq -c '{ok, error}' >&2 || true
              exit 1
            fi
            for k in $nycklar; do
              v="$(printf '%s' "$json" | jq -r --arg k "$k" '.[$k] // 0')"
              tot[$k]=$(( ${tot[$k]} + v ))
            done
            printf '%s' "$json" | jq -r --argjson i "$i" '"rad \($i): \(.behandlade) behandlade, \(.kanAterstallas) går att återställa, \(.aterstallda) återställda, \(.redanOk) redan ok, \(.fotoMissar) fotomissar, \(.fel) fel"' || true
            kvar="$(printf '%s' "$json" | jq -r '.kvarFran // empty')"
            if [ -n "$kvar" ]; then
              if [ "$kvar" -le 0 ]; then
                echo "::error::Ingen framdrift vid rad ${i}" >&2
                exit 1
              fi
              i=$((i + kvar))
            else
              i=$((i + steg))
            fi
          done

          {
            echo "### Recensionsfoton — $([ "$dry" = "true" ] && echo TORRKÖRNING || echo SKARP)"
            echo ""
            echo "| | |"
            echo "|---|---:|"
            echo "| rader i filen | ${n} |"
            for k in $nycklar; do echo "| ${k} | ${tot[$k]} |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "KLART: ${tot[kanAterstallas]} går att återställa, ${tot[aterstallda]} återställda (${tot[fotonAterstallda]} foton), ${tot[fel]} fel"
