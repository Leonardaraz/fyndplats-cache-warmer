name: Dubbletter — lägg ett utkast som färg på en publicerad sida

# Leonards frågor 2026-09-27: dubblettskärmen och syskonsvepet hittar sidor och
# utkast som är samma vara i en annan färg eller storlek. I stället för egna
# sidor (flera URL:er för samma produkt) eller pensionering (en vara vi kan sälja
# slängs) blir givarens artikel ett VAL på en publicerad sida: en option ("Färg"
# eller "Storlek"), en variant per val, och ett val som byter bild.
#
#   - Första gången skapas optionen med två val (sidans och givarens).
#   - Sedan läggs ett val till per körning — kör igen för nästa färg.
#   - Ligger givaren UTE krävs omdirigera=ja: dess recensioner kopieras hit, dess
#     adress omdirigeras hit, och den avpubliceras.
#
# Hela förloppet står i lib/aosom/sammanslagning.ts. Efteråt bär sidan en
# Aosom-artikel per variant, och synken, beställningsfilen och importens
# dubblettspärr läser det via lib/aosom/artiklar.ts.
#
# Samma nyckel-lösa upplägg som ommappningen: produktionen har Wix-nycklarna
# och DATABASE_URL, Actions har CRON_SECRET, och de möts här. Ingen hemlighet
# passerar chatten — och jobbet går att starta från en telefon.
#
# ☠️ TORRKÖRNING ÄR DEFAULT (läget `plan`). Läs planen innan du kör `byt`.
# ☠️ EN GIVARE PER KÖRNING. Paret är en människas bedömning, och bilderna som
#    följer med är en människas granskning — det finns ingen kör-allt-flagga.
# ☠️ EN PUBLICERAD GIVARE FÖRSVINNER FRÅN SAJTEN. Dess adress omdirigeras (301)
#    och sidan avpubliceras — därför krävs omdirigera=ja uttryckligen.
# ☠️ SIDANS NAMN FÅR INTE BÄRA SIDANS FÄRG. Rutten vägrar då (`namnet_bar_farg`):
#    efter sammanslagningen hade namnet sagt en färg medan sidan säljer två.
#    Skriv om namnet först (polerrundan, med oförändrad slug).
# ☠️ BARA GRANSKADE BILDER. Default följer bara utkastets huvudbild med. Ange
#    fler (`bilder`, t.ex. "1,2") bara när du sett dem — 46 % av feedens bilder
#    bär tysk text inbränd, och en del bär husmärkets logotyp.
# ☠️ Svaret bär aldrig artikelnummer eller inköpspris — loggen är PUBLIK.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = torrkörning (skriver inget) · byt = skriv"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - byt
      behall:
        description: "Den PUBLICERADE sidan som behålls (Wix-produkt-id)"
        required: true
        type: string
      utkast:
        description: "Givaren: ett utkast, eller en publicerad sida (kräver omdirigera=ja) (Wix-produkt-id)"
        required: true
        type: string
      axel:
        description: "Färg eller Storlek"
        required: true
        default: "Färg"
        type: choice
        options:
          - Färg
          - Storlek
      farg_behall:
        description: "Värdet sidan redan har, t.ex. Vit. Bara FÖRSTA gången — sedan TOMT."
        required: false
        default: ""
        type: string
      farg_utkast:
        description: "Givarens värde, t.ex. Grå eller 90 × 70 cm"
        required: true
        type: string
      omdirigera:
        description: "Givaren ligger ute: kopiera recensioner, omdirigera och avpublicera den"
        required: true
        default: "nej"
        type: choice
        options:
          - nej
          - ja
      sku:
        description: "Den nya färgens SKU. TOMT = sidans SKU + färgen."
        required: false
        default: ""
        type: string
      bilder:
        description: "Utkastets bilder som följer med, 1-baserat (t.ex. 1,2). TOMT = bara huvudbilden."
        required: false
        default: ""
        type: string

jobs:
  sammanslagning:
    runs-on: ubuntu-latest
    steps:
      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          BEHALL: ${{ inputs.behall }}
          UTKAST: ${{ inputs.utkast }}
          AXEL: ${{ inputs.axel }}
          OMDIRIGERA: ${{ inputs.omdirigera }}
          FARG_BEHALL: ${{ inputs.farg_behall }}
          FARG_UTKAST: ${{ inputs.farg_utkast }}
          SKU: ${{ inputs.sku }}
          BILDER: ${{ inputs.bilder }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # ☠️ TILL STDERR — en ::error::-rad på stdout slukas av en
            # kommandosubstitution.
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi

          url="${BASE%/api/cron/poll-tracking}/api/admin/aosom-sammanslagning"
          apply=false
          [ "${MODE}" = "byt" ] && apply=true
          omdirigera=false
          [ "${OMDIRIGERA}" = "ja" ] && omdirigera=true

          kropp=$(jq -nc \
            --arg behall "${BEHALL}" \
            --arg utkast "${UTKAST}" \
            --arg fb "${FARG_BEHALL}" \
            --arg fu "${FARG_UTKAST}" \
            --arg sku "${SKU}" \
            --arg bilder "${BILDER}" \
            --arg axel "${AXEL}" \
            --argjson apply "${apply}" \
            --argjson omdirigera "${omdirigera}" \
            '{behall: $behall, utkast: $utkast, fargBehall: $fb, fargUtkast: $fu, axel: $axel, omdirigera: $omdirigera, apply: $apply}
             + (if $sku == "" then {} else {sku: $sku} end)
             + (if $bilder == "" then {} else {bilder: ($bilder | split(",") | map(gsub("\\s"; "") | select(. != "") | tonumber))} end)')

          echo "Läge: ${MODE} (apply=${apply})"
          svar=$(curl -sS --max-time 150 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${kropp}" \
            "${url}")

          echo "=== Plan ==="
          # ☠️ HELA jq-PROGRAMMET INDENTERAT — en rad med mindre indrag än
          # blocket avslutar YAML:ens `run: |`.
          echo "$svar" | jq -r '.plan // {} | "  tillstånd       \(.tillstand // "–")\n  \(.axel // "Färg") efteråt   \((.varden // []) | join(" · ")) (nytt: \(.fargUtkast))\n  kundpris        \(.prisBehall) kr (sidan) + \(.prisUtkast) kr (nytt) — ORÖRDA\n  saldo           \(.saldoBehall // "–") (sidan) + \(.saldoUtkast // "–") (nytt)\n  SKU             \(.skuBehall) + \(.skuUtkast)\n  bilder          \(.bilderBehall) på sidan, \(.bilderUtkast) följer med"' || true
          echo "$svar" | jq -r 'if .plan.givarenPublicerad then "  givaren ligger UTE\n  recensioner     \(.plan.recensionerAttKopiera // "–") kopieras till sidan\n  omdirigering    \(.plan.omdirigering // "–")\n  äldre som pekas om \(.plan.omdirigeringarAttPekaOm)" else empty end' || true
          echo "$svar" | jq -r '.plan.varningar[]? | "  ⚠️ \(.)"' || true
          echo "$svar" | jq -r '.steg[]? | "  · \(.)"' || true

          if [ "$(echo "$svar" | jq -r '.ok')" != "true" ]; then
            echo "::error::$(echo "$svar" | jq -r '.fel // .error // "hinder — se listan nedan"')" >&2
            echo "$svar" | jq -r '.plan.hinder[]? | "    [hinder] \(.)"' >&2
            exit 1
          fi

          # ☠️ HÄRIFRÅN ÄR SKRIVNINGEN GJORD (i läge `byt`). Rapporteringen får
          # aldrig fälla jobbet. `|| true` på varje rad härifrån.
          if [ "${MODE}" = "plan" ]; then
            echo "TORRKÖRNING: ingenting skrevs. Kör om med läge 'byt' när planen ser rimlig ut." || true
            exit 0
          fi
          echo "OK: ${UTKAST} är nu valet ${FARG_UTKAST} (${AXEL}) på ${BEHALL} (verifierat vid återläsning)" || true
          echo "Nästa steg: läs sidan live, och skriv om texten om den nämner färgen eller måtten." || true
          exit 0
