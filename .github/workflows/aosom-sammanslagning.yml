name: Dubbletter — lägg ett utkast som färg eller storlek på en publicerad sida

# Leonards frågor 2026-09-27: dubblettskärmen och syskonsvepet hittar sidor och
# utkast som är samma vara i en annan färg eller storlek. I stället för egna
# sidor (flera URL:er för samma produkt) eller pensionering (en vara vi kan sälja
# slängs) blir givarens artikel en VARIANT på en publicerad sida: optionerna
# "Färg" och "Storlek", en variant per artikel, och en färg som byter bild.
#
#   - Givaren anger sitt värde på varje axel sidan har — och på den axel den
#     lägger till. En sida kan ha färg, storlek eller båda.
#   - Sidans värde (farg_behall, storlek_behall) behövs bara på en axel sidan
#     får för FÖRSTA gången. Sedan står sidans val i Wix och i mappningen.
#   - Alla kombinationer behöver inte finnas. En kombination Aosom inte säljer
#     visar butiken som ej valbar.
#   - En variant per körning — kör igen för nästa syskon.
#   - Ligger givaren UTE krävs omdirigera=ja: dess recensioner kopieras hit, dess
#     adress omdirigeras hit, och den avpubliceras.
#
# Exempel: sidan är en grå hundbädd i 90 cm (inga val än), givaren är samma
# bädd i blått och 110 cm. Då: farg_behall=Grå, farg_utkast=Blå,
# storlek_behall=90 cm, storlek_utkast=110 cm. Nästa syskon (grå, 110 cm):
# farg_utkast=Grå, storlek_utkast=110 cm — resten står redan på sidan.
#
# Hela förloppet står i lib/aosom/sammanslagning.ts. Efteråt bär sidan en
# Aosom-artikel per variant, och synken, beställningsfilen och importens
# dubblettspärr läser det via lib/aosom/artiklar.ts.
#
# Samma nyckel-lösa upplägg som ommappningen: produktionen har Wix-nycklarna
# och DATABASE_URL, Actions har CRON_SECRET, och de möts här. Ingen hemlighet
# passerar chatten — och jobbet går att starta från en telefon.
#
# ☠️ TORRKÖRNING ÄR DEFAULT (läget `plan`). Läs planen innan du kör `byt`.
# ☠️ EN GIVARE PER KÖRNING. Paret är en människas bedömning, och bilderna som
#    följer med är en människas granskning — det finns ingen kör-allt-flagga.
# ☠️ EN PUBLICERAD GIVARE FÖRSVINNER FRÅN SAJTEN. Dess adress omdirigeras (301)
#    och sidan avpubliceras — därför krävs omdirigera=ja uttryckligen.
# ☠️ SIDANS NAMN FÅR INTE BÄRA SIDANS FÄRG ELLER STORLEK. Rutten vägrar då
#    (`namnet_bar_farg`, `namnet_bar_storlek`): efter sammanslagningen hade
#    namnet sagt en färg medan sidan säljer två. Skriv om namnet först
#    (polerrundan, med oförändrad slug).
# ☠️ BARA GRANSKADE BILDER. Default följer utkastets huvudbild med när givaren
#    för in en ny färg (eller en ny storlek på en sida utan färgval) — annars
#    ingen. Ange fler (`bilder`, t.ex. "1,2") bara när du sett dem — 46 % av
#    feedens bilder bär tysk text inbränd, och en del bär husmärkets logotyp.
# ☠️ Svaret bär aldrig artikelnummer eller inköpspris — loggen är PUBLIK.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = torrkörning (skriver inget) · byt = skriv"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - byt
      behall:
        description: "Den PUBLICERADE sidan som behålls (Wix-produkt-id)"
        required: true
        type: string
      utkast:
        description: "Givaren: ett utkast, eller en publicerad sida (kräver omdirigera=ja) (Wix-produkt-id)"
        required: true
        type: string
      farg_utkast:
        description: "Givarens färg, t.ex. Grå. Krävs när sidan har eller får färgval."
        required: false
        default: ""
        type: string
      storlek_utkast:
        description: "Givarens storlek, t.ex. 110 × 85 cm. Krävs när sidan har eller får storleksval."
        required: false
        default: ""
        type: string
      farg_behall:
        description: "Sidans färg — bara när sidan FÅR färgval nu. Annars TOMT."
        required: false
        default: ""
        type: string
      storlek_behall:
        description: "Sidans storlek — bara när sidan FÅR storleksval nu. Annars TOMT."
        required: false
        default: ""
        type: string
      omdirigera:
        description: "Givaren ligger ute: kopiera recensioner, omdirigera och avpublicera den"
        required: true
        default: "nej"
        type: choice
        options:
          - nej
          - ja
      sku:
        description: "Den nya variantens SKU, högst 40 tecken. TOMT = sidans SKU + givarens nya värden."
        required: false
        default: ""
        type: string
      bilder:
        description: "Utkastets bilder som följer med, 1-baserat (t.ex. 1,2). TOMT = huvudbilden vid ny färg, annars ingen."
        required: false
        default: ""
        type: string

jobs:
  sammanslagning:
    runs-on: ubuntu-latest
    steps:
      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          BEHALL: ${{ inputs.behall }}
          UTKAST: ${{ inputs.utkast }}
          OMDIRIGERA: ${{ inputs.omdirigera }}
          FARG_UTKAST: ${{ inputs.farg_utkast }}
          STORLEK_UTKAST: ${{ inputs.storlek_utkast }}
          FARG_BEHALL: ${{ inputs.farg_behall }}
          STORLEK_BEHALL: ${{ inputs.storlek_behall }}
          SKU: ${{ inputs.sku }}
          BILDER: ${{ inputs.bilder }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # ☠️ TILL STDERR — en ::error::-rad på stdout slukas av en
            # kommandosubstitution.
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi

          url="${BASE%/api/cron/poll-tracking}/api/admin/aosom-sammanslagning"
          apply=false
          [ "${MODE}" = "byt" ] && apply=true
          omdirigera=false
          [ "${OMDIRIGERA}" = "ja" ] && omdirigera=true

          kropp=$(jq -nc \
            --arg behall "${BEHALL}" \
            --arg utkast "${UTKAST}" \
            --arg fu "${FARG_UTKAST}" \
            --arg su "${STORLEK_UTKAST}" \
            --arg fb "${FARG_BEHALL}" \
            --arg sb "${STORLEK_BEHALL}" \
            --arg sku "${SKU}" \
            --arg bilder "${BILDER}" \
            --argjson apply "${apply}" \
            --argjson omdirigera "${omdirigera}" \
            '{behall: $behall, utkast: $utkast, fargUtkast: $fu, storlekUtkast: $su, fargBehall: $fb, storlekBehall: $sb, omdirigera: $omdirigera, apply: $apply}
             + (if $sku == "" then {} else {sku: $sku} end)
             + (if $bilder == "" then {} else {bilder: ($bilder | split(",") | map(gsub("\\s"; "") | select(. != "") | tonumber))} end)')

          echo "Läge: ${MODE} (apply=${apply})"
          svar=$(curl -sS --max-time 150 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${kropp}" \
            "${url}")

          echo "=== Plan ==="
          # ☠️ HELA jq-PROGRAMMET INDENTERAT — en rad med mindre indrag än
          # blocket avslutar YAML:ens `run: |`.
          echo "$svar" | jq -r '
            .plan // {} |
            "  tillstånd       \(.tillstand // "–")",
            "  axlar           \((.axlar // []) | join(" × "))\(if ((.nyaAxlar // []) | length) > 0 then " (ny: \(.nyaAxlar | join(", ")))" else "" end)",
            ((.varden // {}) | to_entries[] | "  \(.key) efteråt: \(.value | join(" · "))"),
            "  nya varianten   \((.nyttVal // {}) | to_entries | map("\(.key) \(.value)") | join(", "))",
            "  varianter       \(.varianter // "–")\(if (.saknadeKombinationer // 0) > 0 then " (\(.saknadeKombinationer) kombinationer finns inte)" else "" end)",
            "  kundpris        \(.prisBehall) kr (sidan) + \(.prisUtkast) kr (nytt) — ORÖRDA",
            "  saldo           \(.saldoBehall // "–") (sidan) + \(.saldoUtkast // "–") (nytt)",
            "  SKU             \(.skuBehall) + \(.skuUtkast)",
            "  bilder          \(.bilderBehall) på sidan, \(.bilderUtkast) följer med"
          ' || true
          echo "$svar" | jq -r 'if .plan.givarenPublicerad then "  givaren ligger UTE\n  recensioner     \(.plan.recensionerAttKopiera // "–") kopieras till sidan\n  omdirigering    \(.plan.omdirigering // "–")\n  äldre som pekas om \(.plan.omdirigeringarAttPekaOm)" else empty end' || true
          echo "$svar" | jq -r '.plan.varningar[]? | "  ⚠️ \(.)"' || true
          echo "$svar" | jq -r '.steg[]? | "  · \(.)"' || true

          if [ "$(echo "$svar" | jq -r '.ok')" != "true" ]; then
            echo "::error::$(echo "$svar" | jq -r '.fel // .error // "hinder — se listan nedan"')" >&2
            echo "$svar" | jq -r '.plan.hinder[]? | "    [hinder] \(.)"' >&2
            exit 1
          fi

          # ☠️ HÄRIFRÅN ÄR SKRIVNINGEN GJORD (i läge `byt`). Rapporteringen får
          # aldrig fälla jobbet. `|| true` på varje rad härifrån.
          if [ "${MODE}" = "plan" ]; then
            echo "TORRKÖRNING: ingenting skrevs. Kör om med läge 'byt' när planen ser rimlig ut." || true
            exit 0
          fi
          echo "OK: ${UTKAST} är nu en variant på ${BEHALL} (verifierat vid återläsning)" || true
          echo "Nästa steg: läs sidan live, och skriv om texten om den nämner färgen eller måtten." || true
          exit 0
