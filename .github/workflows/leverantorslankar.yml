name: Leverantörslänkar — Aosom- och AliExpress-länk för en lista produkter (krypterat)

# Svarar med produktsidan hos leverantören för en hel lista produkter, samma
# länk som "Öppna hos Aosom" i /admin/source-lookup. En sammanslagen
# Aosom-sida får en länk per färg.
#
# VARFÖR DEN FINNS (Leonard 2026-10-07). Han ville ha Aosom-länken bredvid
# varje produkt i två listor, 505 produkter. Uppslaget tar en produkt i taget,
# och kuvertet i polish-mapping.yml likaså, med inköpspriset bredvid.
#
# ☠️ KUVERTET ÄR OBLIGATORISKT. Länken bär artikelnumret, och loggen är
# PUBLIK. Det finns inget klartextläge. Samma hybridkryptering som
# aosom-reviews-kandidater.yml: RSA-OAEP/SHA-256 på ett slumpat lösenord,
# AES-256-CBC/PBKDF2 på listan. Svaret bär inga kostnader.
#
# Återanvänder befintliga repository secrets:
#   POLL_TRACKING_URL — bas-URL:en härleds härifrån (byter path-suffix)
#   CRON_SECRET       — samma värde som CRON_SECRET i Vercel env vars

on:
  workflow_dispatch:
    inputs:
      kuvert:
        description: "OBLIGATORISK: base64 av en RSA-publik nyckel (PEM). Länkarna krypteras mot den."
        required: true
        type: string
      produkter:
        description: "Wix-produkt-id, slug eller butiksadress, åtskilda av komma, mellanslag eller radbrytning. Högst 1 000."
        required: true
        type: string

jobs:
  lankar:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta och kryptera
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KUVERT: ${{ inputs.kuvert }}
          PRODUKTER: ${{ inputs.produkter }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi

          # Nyckeln kontrolleras FÖRE anropet: faller den ska ingenting ha
          # hämtats, och absolut ingenting skrivas ut.
          if ! printf '%s' "${KUVERT}" | base64 -d > kuvert.pub 2>/dev/null; then
            echo "::error::kuvert: inputet ar inte giltig base64" >&2
            exit 1
          fi
          if ! openssl pkey -pubin -in kuvert.pub -noout 2>kuvert.fel; then
            echo "::error::kuvert: inte en RSA-publik nyckel i PEM-format" >&2
            cat kuvert.fel >&2
            exit 1
          fi

          # Listan delas i rutten (samma tolkning som uppslaget). Här blir den
          # bara en JSON-kropp, så ingen del av den hamnar i en URL.
          jq -n --arg t "$PRODUKTER" '{produkter: $t}' > kropp.json

          url="${BASE%/api/cron/poll-tracking}/api/admin/leverantorslankar"

          # ☠️ Svaret bär artikelnummer. Det går rakt till en FIL och läses
          # sedan bara av jq — det passerar aldrig en variabel som något kan
          # råka echo:a, och det skrivs aldrig ut.
          kod=$(curl -sS -o svar.json -w '%{http_code}' --max-time 150 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' --data-binary @kropp.json "$url")
          rm -f kropp.json
          if [ "$kod" != "200" ]; then
            echo "::error::HTTP ${kod}" >&2
            jq -c '{ok, error}' svar.json >&2 2>/dev/null || true
            rm -f svar.json
            exit 1
          fi

          # Räknarna är ofarliga och går till loggen och sammanfattningen.
          jq -r '"produkter \(.antal) · med mappning \(.hittade) · Aosom \(.aosom) · AliExpress \(.aliexpress) · sammanslagna \(.sammanslagna) · utan länk \(.utanLank) · utan mappning \(.utanMappning | length) · finns inte \(.utanProdukt | length) · ogiltiga \(.ogiltiga | length) · flödet \(if .flodetFel then "FÖLL" elif .flodetHamtat then "hämtat" else "behövdes inte" end)"' svar.json
          {
            echo "### Leverantörslänkar"
            echo ""
            jq -r '
              "| | |\n|---|---:|",
              "| produkter i listan | \(.antal) |",
              "| **med mappning** | **\(.hittade)** |",
              "| Aosom | \(.aosom) |",
              "| AliExpress | \(.aliexpress) |",
              "| sammanslagna sidor | \(.sammanslagna) |",
              "| utan länk | \(.utanLank) |",
              "| utan mappning | \(.utanMappning | length) |",
              "| finns inte i butiken | \(.utanProdukt | length) |",
              "| ogiltiga rader | \(.ogiltiga | length) |"
            ' svar.json
            echo ""
            echo "Länkarna finns bara krypterade i loggen."
          } >> "$GITHUB_STEP_SUMMARY"

          jq -j '{lankar, utanMappning, utanProdukt, ogiltiga} | tostring' svar.json > kuvert.klartext
          rm -f svar.json

          # ☠️ HYBRID, INTE RAK RSA — listan är tiotals kilobyte. Lösenordet
          # ligger i en FIL, aldrig i argv. Och openssl:s fel SYNS: de
          # beskriver nycklar och padding, aldrig innehållet.
          openssl rand -base64 32 > kuvert.losen
          if ! openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:kuvert.losen \
               -in kuvert.klartext -out kuvert.data 2>kuvert.fel; then
            echo "::error::kuvert: AES-steget misslyckades — inget skrivs ut" >&2
            cat kuvert.fel >&2
            rm -f kuvert.klartext kuvert.pub kuvert.losen kuvert.data kuvert.fel
            exit 1
          fi
          # ☠️ INGEN FALLBACK TILL KLARTEXT. Faller RSA-steget faller jobbet.
          if ! openssl pkeyutl -encrypt -pubin -inkey kuvert.pub \
               -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
               -in kuvert.losen -out kuvert.losen.enc 2>kuvert.fel; then
            echo "::error::kuvert: RSA-steget misslyckades — inget skrivs ut" >&2
            cat kuvert.fel >&2
            rm -f kuvert.klartext kuvert.pub kuvert.losen kuvert.losen.enc kuvert.data kuvert.fel
            exit 1
          fi
          rm -f kuvert.klartext kuvert.pub kuvert.losen kuvert.fel

          echo
          echo "=== Kuvert (RSA-OAEP/SHA-256 + AES-256-CBC/PBKDF2, base64) ==="
          echo "losen: $(base64 -w0 kuvert.losen.enc)"
          # Datat bryts i rader om 4 000 tecken så loggvyn inte kortar av det.
          echo "data-borjan"
          base64 -w 4000 kuvert.data
          echo "data-slut"
          rm -f kuvert.losen.enc kuvert.data
          echo "(dekryptera: RSA-oppna losen med din privata nyckel, sla ihop"
          echo " data-raderna, sedan openssl enc -d -aes-256-cbc -pbkdf2 -pass file:<losen>)"
