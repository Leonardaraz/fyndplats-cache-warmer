name: Leverantör — lägg om en dubblett till Aosom

# Pekar en PUBLICERAD AliExpress-rad på dess Aosom-motsvarighet, så att vi
# slutar köpa samma vara via en mellanhand — utan att skapa en andra produktsida.
#
# Bakgrund och varje spärrs motiv: lib/store/remap-supplier.ts.
#
# ☠️ Nyckel-lös på husets vanliga sätt: produktionen har DATABASE_URL, Actions
# har CRON_SECRET, och de möts här. Ingen hemlighet passerar chatten.
#
# ☠️ Torrkörning är default. `torr` skriver ingenting och visar exakt den plan
# `skarp` skulle utföra — inklusive kostnadsdeltat per par, som är hela skälet
# att omläggningen inte är automatisk: Aosoms SE-frakt är per kolli, och på
# lätta, billiga varor blir omläggningen DYRARE. Rutten vägrar en fördyring över
# tio procent om du inte uttryckligen tvingar den.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "torr = visa planen · skarp = skriv"
        required: true
        default: "torr"
        type: choice
        options:
          - torr
          - skarp
      pairs:
        description: 'JSON-array: [{"live":"<wixProductId>","utkast":"<wixProductId>"}]'
        required: true
        type: string
      tvinga_fordyring:
        description: "true = tillåt att inköpet blir dyrare. Läs deltat i torrkörningen först."
        required: false
        default: "false"
        type: string

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
          PAIRS: ${{ inputs.pairs }}
          TVINGA: ${{ inputs.tvinga_fordyring }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # Till STDERR. En ::error::-rad pa stdout slukas av
            # kommandosubstitutionen nedan (lardom 2026-08-28).
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi

          if ! echo "${PAIRS}" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
            echo "::error::pairs maste vara en icke-tom JSON-array" >&2
            exit 1
          fi

          kropp=$(echo "${PAIRS}" | jq -c --arg t "${TVINGA}" \
            '{pairs: [.[] | . + (if $t == "true" then {tvingaFordyring: true} else {} end)]}')

          url="${BASE%/api/cron/poll-tracking}/api/admin/remap-supplier"
          if [ "${MODE}" = "skarp" ]; then
            url="${url}?dryRun=false"
          fi

          svar=$(curl -sS --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${kropp}" "${url}")

          echo "=== Svar ==="
          echo "$svar" | jq '{ok, dryRun, granskade, omlagda, vagrade, misslyckade, kostnadsforandringSek}'
          echo
          echo "=== Rad for rad ==="
          echo "$svar" | jq -r '.rader[] | "  \(.status | ascii_upcase)  \(.live[0:8]) -> \(.till // "-")  \(.franLandedCostSek // "-") -> \(.tillLandedCostSek // "-") kr  (\(.deltaPct // 0) %)  \(.skal // "")"'

          if [ "$(echo "$svar" | jq -r '.rader | map(select(.status == "vagrad")) | length')" != "0" ]; then
            echo
            echo "=== Vagrade, med skal ==="
            echo "$svar" | jq -r '.rader[] | select(.status == "vagrad") | "  \(.live[0:8]): \(.skal) — \(.detalj // "")"'
          fi

          if [ "$(echo "$svar" | jq -r '.ok')" != "true" ]; then
            echo "::error::$(echo "$svar" | jq -r '.error // "misslyckade rader — se listan ovan"')" >&2
            exit 1
          fi

          # ☠️ Rapportering EFTER en skrivning far aldrig falla jobbet (lardom
          # 2026-09-02: sexton lyckade stamplingar rapporterades som misslyckade).
          if [ "${MODE}" = "skarp" ]; then
            echo "OK: $(echo "$svar" | jq -r '.omlagda') rader omlagda, kostnadsforandring $(echo "$svar" | jq -r '.kostnadsforandringSek') kr." || true
            echo "PAMINNELSE: kundens pris ar OROR. Aosom-synken upptacker den nya" || true
            echo "kostnaden vid nasta korning och skriver priset da — det ar en egen," || true
            echo "synlig handelse, inte en tyst foljd av den har skrivningen." || true
          fi
          exit 0
