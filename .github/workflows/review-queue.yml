name: Recensionskö (svep katalogen)

# Manuell trigger för /api/cron/review-queue — letar recensioner hos AliExpress
# och lägger dem i översättningskön (status `pending`, tom svensk text →
# osynliga för kund tills de översatts och godkänts).
#
# Varför en workflow och inte bara Vercel-cronen: rutten tar högst ~40 produkter
# per anrop (maxDuration 300 s), och katalogen är ~693 publicerade produkter.
# Den här kör anropet i RUNDOR tills det inte finns fler produkter att beta av,
# alltså hela katalogen i ett svep. Vercel-cronen håller den sedan färsk.
#
# Kostar ingenting: AE:s feedback-endpoint är ett öppet JSON-anrop och ingen
# översättningstjänst rörs. Översättningen görs i chatten, gratis och kurerad.
#
# Återanvänder befintliga repository secrets:
#   POLL_TRACKING_URL — bas-URL:en härleds härifrån (byter path-suffix)
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Max antal rundor (stannar tidigare när katalogen är genombetad)"
        required: false
        default: "20"
        type: string
      limit:
        description: "Produkter per runda (rutten tar högst 200, 40 håller körtiden trygg)"
        required: false
        default: "40"
        type: string
      dry_run:
        description: "Torrkörning — hitta och räkna, skriv ingenting (kör alltid EN runda)"
        required: false
        default: false
        type: boolean
      recheck_all:
        description: "Ta om HELA katalogen, även nyligen kontrollerade produkter (använd efter en filter-rättning)"
        required: false
        default: false
        type: boolean
      min_length:
        description: "Bara recensioner LÄNGRE än så här (301 = hämta hem det gamla 300-teckenstaket kastade). Tomt = normalt golv 50."
        required: false
        default: ""
        type: string
      pages:
        description: "Sidor att hämta per produkt hos AE (1-5, 20 recensioner/sida)"
        required: false
        default: "2"
        type: string

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Sveper katalogen efter nya recensioner
        run: |
          base="${{ secrets.POLL_TRACKING_URL }}"
          base="${base%/api/cron/poll-tracking}/api/cron/review-queue"
          dry=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then dry="&dryRun=true"; fi

          # Omkontroll av hela katalogen: gränsen sätts EN gång, till svepets
          # starttid, och skickas oförändrad i varje runda. Produkter stämplas
          # allteftersom → kandidaterna tar slut och loopen bryter av sig själv.
          recheck=""
          if [ "${{ inputs.recheck_all }}" = "true" ]; then
            recheck="&checkedBefore=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          # Riktat svep: bara recensioner som det gamla 300-teckenstaket
          # omöjligt kunde ha importerat. Utan det tävlar de mot de redan
          # sparade korta om samma topp-N-platser — och förlorar, eftersom
          # längdpoängen är maxad redan vid 300 tecken.
          minlen=""
          if [ -n "${{ inputs.min_length }}" ]; then
            minlen="&minLength=${{ inputs.min_length }}"
          fi

          total_queued=0
          total_checked=0
          total_throttled=0

          for i in $(seq 1 ${{ inputs.rounds }}); do
            url="${base}?limit=${{ inputs.limit }}&pages=${{ inputs.pages }}${dry}${recheck}${minlen}"
            body=$(curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$url")
            ok=$(echo "$body" | jq -r '.ok // false')
            if [ "$ok" != "true" ]; then
              echo "::error::Runda $i misslyckades: $(echo "$body" | head -c 400)"
              exit 1
            fi

            candidates=$(echo "$body" | jq -r '.kandidater // 0')
            checked=$(echo "$body" | jq -r '.kontrollerade // 0')
            queued=$(echo "$body" | jq -r '.["köade"] // 0')
            throttled=$(echo "$body" | jq -r '.strypta // 0')
            echo "Runda $i: $candidates kandidater, $checked kontrollerade, $queued köade, $throttled strypta"

            total_queued=$((total_queued + queued))
            total_checked=$((total_checked + checked))
            total_throttled=$((total_throttled + throttled))

            # Inga kandidater kvar → hela katalogen är genombetad.
            if [ "$candidates" = "0" ]; then
              echo "Katalogen genombetad efter $i rundor."
              break
            fi
            # Torrkörning stämplar ingenting, så runda 2 skulle hämta exakt
            # samma produkter igen. En runda räcker för att se vad som händer.
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Torrkörning — stannar efter en runda."
              break
            fi
            # Strypning betyder att AE ber oss sakta ner — vila längre.
            if [ "$throttled" -gt 0 ]; then sleep 60; else sleep 10; fi
          done

          {
            echo "### Recensionskö"
            echo ""
            if [ -n "${{ inputs.min_length }}" ]; then
              echo "_Riktat svep: bara recensioner över ${{ inputs.min_length }} tecken._"
              echo ""
            fi
            echo "- Kontrollerade produkter: **$total_checked**"
            echo "- Köade recensioner: **$total_queued**"
            echo "- Strypta hämtningar: **$total_throttled** (tas nästa körning)"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo ""
              echo "_Torrkörning — ingenting skrevs._"
            else
              echo ""
              echo "Köade recensioner ligger som \`pending\` med tom svensk text och syns"
              echo "INTE för kund. Be Claude i chatten översätta dem."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
