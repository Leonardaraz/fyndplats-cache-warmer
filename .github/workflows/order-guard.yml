name: Order guard (manuell trigger)

# Manuell trigger för /api/cron/order-guard ("morgonkollen"). Det ordinarie
# schemat ligger i Vercel Cron (vercel.json, 04:45 UTC dagligen) — den här
# workflown har MEDVETET inget schedule: den skulle annars skicka ett andra
# morgonmejl. Den finns för att kunna testa/köra vakten på begäran utan att
# känna till CRON_SECRET (dispatch → curl med repo-secreten).
#
# Återanvänder befintliga repository secrets:
#   POLL_TRACKING_URL — bas-URL:en härleds härifrån (byter path-suffix)
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger order-guard endpoint
        run: |
          url="${{ secrets.POLL_TRACKING_URL }}"
          url="${url%/api/cron/poll-tracking}/api/cron/order-guard"
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$url")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned non-200 status"
            exit 1
          fi
