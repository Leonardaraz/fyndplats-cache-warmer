name: Poll AliExpress tracking

# Pingar /api/cron/poll-tracking så Next.js-appen kan hämta spårningsnummer
# från AliExpress DS API och pusha dem till Wix Stores.
#
# ☠️ BARA FÖR HAND (sedan 2026-10-29). Spårningen går varje timme från
# vercel.json, eftersom motorn ligger på Pro och Vercels cron går på minuten.
# GitHub körde det här schemat (var tredje timme) 22 gånger på fem dagar i
# stället för ~41, med 2,3–8,4 timmar mellan körningarna. Schemat ska inte
# tillbaka som reserv: rutten har ingen spärr mot två samtidiga körningar,
# och båda hade försökt skicka samma rad (se CLAUDE.md).
#
# Krävs som repository secret (Settings → Secrets and variables → Actions):
#   POLL_TRACKING_URL — fullständig URL, t.ex.
#       https://fyndplats-cache-warmer.vercel.app/api/cron/poll-tracking
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars
#                 (genereras med `openssl rand -hex 32`)

on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll-tracking endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.POLL_TRACKING_URL }}")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned non-200 status"
            exit 1
          fi
