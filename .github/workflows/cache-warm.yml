name: Cache Warm Fyndplats

on:
  schedule:
    # Var 30:e min (sänkt från var 10:e). I kombination med produktsidornas
    # revalidate=3600 + nyckelsido-urvalet i ping_sitemap.py kapar detta
    # Vercel ISR Writes / Function Invocations / Observability rejält.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet aiohttp
      - name: Warm cache
        run: python ping_sitemap.py
