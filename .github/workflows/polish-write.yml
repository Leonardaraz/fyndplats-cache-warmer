name: Polering — skriv en runda till Wix

# Ersätter steg1–5.js och de femton separata stämplingarna (2026-09-24).
#
# Fram till N56 skrevs varje runda genom att hela skrivskriptet (~87 000
# tecken) skrevs av i chatten och kördes i Wix körmiljö, följt av en
# polish-mapping-körning per produkt. Här läses rundans skrivplan.json ur
# grenen, kontrolleras mot sin sha256 och skickas till /api/admin/polish-write
# ett steg i taget. Ingenting skrivs av.
#
# Planen byggs med tools/polish-gates/bygg-skrivplan.py, som skriver ut
# sha256:n. Kontrollen fångar en körning mot fel gren eller en äldre commit:
# workflow_dispatch kör mot den ref man anger, och default är main.
#
# Lägen:
#   torr       prövar planen, alla fyra skrivstegen och recensionerna, skriver ingenting
#   skriv      prövar recensionerna först; text → media → kategorier → sku, stoppar
#              vid första fel; väntar, verifierar och stämplar de produkter som
#              verifieras; skriver sist recensionerna
#   verifiera  läser bara: jämför Wix mot planen
#   stampla    verifierar och stämplar det som stämmer, och skriver recensionerna
#              (efter en avbruten körning)
#
# ☠️ RECENSIONERNA KAN INTE GLÖMMAS (Leonard 2026-10-30). Varje produkt i planen
# prövas mot rundans recensioner.json (runbookens steg 9). Har en produkt
# väntande recensioner utan beslut stoppar `skriv` innan något skrivs, och en
# saknad recensioner.json räknas som inga beslut. Logiken bor i
# lib/reviews/polering.ts, via /api/admin/polish-recensioner.
#
# Alla steg tål omkörning: texten och bilderna skrivs likadant igen, en koppling
# som redan finns svarar ALREADY_EXISTS och räknas som gjord, SKU:n blir densamma.
#
# ☠️ LOGGEN ÄR PUBLIK. Jobbet skriver bara kort-id, ok/fel och antal. Rutten
# tvättar dessutom varje felmeddelande från artikelnummerformer innan det
# lämnar servern, och planen kan inte bära sådana (valideraPlan).

on:
  workflow_dispatch:
    inputs:
      runda:
        description: "Rundans katalog under tools/polish-assets, t.ex. runda-n57-billigast"
        required: true
        type: string
      plan_sha256:
        description: "sha256 av skrivplan.json — bygg-skrivplan.py skriver ut den"
        required: true
        type: string
      lage:
        description: "torr = pröva, skriv inget · skriv = skriv, verifiera, stämpla · verifiera = bara läs · stampla = verifiera och stämpla"
        required: true
        default: "torr"
        type: choice
        options:
          - torr
          - skriv
          - verifiera
          - stampla

concurrency:
  # Två rundor som skriver samtidigt mot samma butik ger revisionskonflikter.
  group: polish-write
  cancel-in-progress: false

jobs:
  skriv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Kör
        env:
          BASE: ${{ secrets.POLL_TRACKING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUNDA: ${{ inputs.runda }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          LAGE: ${{ inputs.lage }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::POLL_TRACKING_URL eller CRON_SECRET saknas" >&2
            exit 1
          fi
          if ! [[ "${RUNDA}" =~ ^runda-[a-z0-9-]+$ ]]; then
            echo "::error::runda ska ha formen runda-<namn>" >&2
            exit 1
          fi
          if ! [[ "${PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::plan_sha256 ska vara 64 hextecken" >&2
            exit 1
          fi

          fil="tools/polish-assets/${RUNDA}/skrivplan.json"
          if [ ! -f "${fil}" ]; then
            echo "::error::${fil} finns inte på ${GITHUB_REF_NAME} — kör mot poleringsgrenen, inte main" >&2
            exit 1
          fi
          faktisk=$(sha256sum "${fil}" | cut -d' ' -f1)
          if [ "${faktisk}" != "${PLAN_SHA256}" ]; then
            echo "::error::skrivplan.json på ${GITHUB_REF_NAME} har sha256 ${faktisk}, inte den angivna. Fel gren, eller en plan som byggts om efter pushen? Ingenting skrivet." >&2
            exit 1
          fi
          echo "Plan: ${fil} ($(jq '.produkter | length' "${fil}") produkter), ${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}, läge ${LAGE}"

          rot="${BASE%/api/cron/poll-tracking}"

          # Ett steg mot rutten. Svaret hamnar i svar.json; returnerar 0 bara
          # när rutten svarar ok. Skriver bara kort, ok/fel och antal.
          steg() {
            jq -c --arg s "$1" --argjson d "$2" '{steg: $s, dryRun: $d, plan: .}' "${fil}" > kropp.json
            http=$(curl -sS --max-time 310 -o svar.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data-binary @kropp.json \
              "${rot}/api/admin/polish-write") || http="000"
            if ! jq -e . svar.json > /dev/null 2>&1; then
              echo "== $1: HTTP ${http}, svaret är inte JSON" >&2
              return 1
            fi
            echo "== $1 (HTTP ${http}): $(jq -r '.sammanfattning // .error // "?"' svar.json)"
            jq -r '.avbrutet // empty | "   AVBRUTET: \(.)"' svar.json
            jq -r '.fel[]? | "   plan: \(.)"' svar.json
            jq -r '.rader[]? | "   \(.kort // "-")\(if .kat then " [\(.kat)]" else "" end) \(if .ok then "ok" else "FEL: \(.fel // "?")" end)\(if .publicerad == false or .publiceras == false then " — INTE PUBLICERAD: \(.hinder // "?")" else "" end)"' svar.json
            [ "$(jq -r '.ok' svar.json)" = "true" ]
          }

          # Verifierar; läser om en gång efter en paus om något faller, för
          # läsprojektionen släpar ibland efter skrivningen. Stämplar sedan
          # varje produkt som är helt verifierad i den SENASTE läsningen.
          verifiera_och_stampla() {
            if ! steg verifiera true; then
              echo "Något föll — väntar 60 s och läser om (projektionen kan släpa)."
              sleep 60
              steg verifiera true || true
            fi
            jq -c '[.rader[]? | select(.ok) | .kort]' svar.json > verifierade.json
            # En produkt som publiceringsspärren höll tillbaka (en VEVOR-vara utan
            # komplett GPSR, lib/publicering.ts) är skriven men inte publicerad.
            # Den stämplas som polerad men inte som publicerad.
            jq -c '[.rader[]? | select(.ok and .publicerad == false) | .kort]' svar.json > hindrade.json
            jq -c --slurpfile ok verifierade.json --slurpfile h hindrade.json \
              '.produkter[] | select(.kort as $k | $ok[0] | index($k)) | {kort, pid, variantId, sku, varianter, hindrad: (.kort as $k | $h[0] | index($k) != null)}' \
              "${fil}" > att-stampla.jsonl

            stamplade=0; stampelfel=0
            while IFS= read -r rad; do
              kort=$(echo "${rad}" | jq -r '.kort')
              # En sammanslagen sida (`varianter`) stämplas utan SKU:er — varje
              # färg har redan sin egen från sammanslagningen.
              kropp=$(echo "${rad}" | jq -c '{wixProductId: .pid, patch: ({needsAiPolish: false} + (if .hindrad then {} else {draftStatus: "published"} end) + (if .varianter then {} else {variantSkus: {(.variantId): .sku}} end))}')
              svar=$(curl -sS --max-time 60 -X POST \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -H "Content-Type: application/json" \
                -d "${kropp}" "${rot}/api/admin/mapping") || svar='{"ok":false,"error":"curl misslyckades"}'
              if [ "$(echo "${svar}" | jq -r '.ok' 2>/dev/null || echo false)" = "true" ]; then
                stamplade=$((stamplade + 1))
                if [ "$(echo "${rad}" | jq -r '.hindrad')" = "true" ]; then
                  echo "   ${kort} stämplad som polerad, INTE publicerad (spärren, se raden ovan)"
                else
                  echo "   ${kort} stämplad"
                fi
              else
                stampelfel=$((stampelfel + 1))
                echo "   ${kort} STÄMPEL FEL: $(echo "${svar}" | jq -r '.error // "?"' 2>/dev/null | cut -c1-200)" >&2
              fi
            done < att-stampla.jsonl

            totalt=$(jq '.produkter | length' "${fil}")
            verifierade=$(jq 'length' verifierade.json)
            echo "Verifierade ${verifierade} av ${totalt}, stämplade ${stamplade}, stämpelfel ${stampelfel}"
            {
              echo "### ${RUNDA} — ${LAGE}"
              echo "Verifierade **${verifierade} av ${totalt}**, stämplade **${stamplade}**, stämpelfel **${stampelfel}**."
            } >> "${GITHUB_STEP_SUMMARY}"
            [ "${verifierade}" = "${totalt}" ] && [ "${stampelfel}" = "0" ]
          }

          # ☠️ Mediasteget återställer variantens bild till huvudbilden på en sida med
          # färgval, och varukorgen visar då första färgens bild oavsett vald färg
          # (2026-10-14: 557 publicerade sidor, se variantbild.yml). Rättningen läser
          # först och skriver bara där en variant avviker, och kontrollerar efteråt
          # att allt utom bilden är oförändrat. Bara sammanslagna sidor (`varianter`)
          # kan ha fel bild. Ett fel här fäller inte rundan, men en avvikelse
          # (något annat än bilden ändrades) gör det.
          variantbilder() {
            mapfile -t pids < <(jq -r '.produkter[] | select(.varianter) | .pid' "${fil}")
            if [ "${#pids[@]}" -eq 0 ]; then
              echo "Variantbilder: ingen sammanslagen sida i rundan."
              return 0
            fi
            vb_tot=0; vb_rattade=0; vb_avv=0; vb_kvar=0
            for ((i = 0; i < ${#pids[@]}; i += 20)); do
              lista=$(IFS=,; echo "${pids[*]:i:20}")
              antal=$(( ${#pids[@]} - i < 20 ? ${#pids[@]} - i : 20 ))
              vbhttp=$(curl -sS --max-time 300 -o vb.json -w '%{http_code}' \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${rot}/api/cron/variantbild?dryRun=false&ids=${lista}&maxSeconds=240") || vbhttp="000"
              if ! jq -e . vb.json > /dev/null 2>&1; then
                echo "::warning::Variantbilder: HTTP ${vbhttp}, svaret är inte JSON (${antal} sidor ej kontrollerade)" >&2
                vb_kvar=$((vb_kvar + antal))
                continue
              fi
              vb_tot=$((vb_tot + $(jq -r '.kontrollerade // 0' vb.json)))
              vb_rattade=$((vb_rattade + $(jq -r '.summa.rattad // 0' vb.json)))
              vb_avv=$((vb_avv + $(jq -r '.summa.avvikelse // 0' vb.json)))
              vb_kvar=$((vb_kvar + $(jq -r '(.summa.torr // 0) + (.summa.ej_rattad // 0) + (.summa.fel // 0)' vb.json)))
              jq -r '.produkter[]? | select(.status == "avvikelse" or .status == "ej_rattad" or .status == "fel") | "   variantbilder \(.id[0:8]) \(.status)\(if .avvikelser then ": " + (.avvikelser | join("; ")) else "" end)"' vb.json
            done
            echo "Variantbilder: ${vb_tot} sidor kontrollerade, ${vb_rattade} rättade, ${vb_kvar} kvar, ${vb_avv} avvikelser"
            echo "Variantbilder: **${vb_rattade}** rättade av ${vb_tot}, kvar **${vb_kvar}**, avvikelser **${vb_avv}**." >> "${GITHUB_STEP_SUMMARY}"
            if [ "${vb_kvar}" != "0" ]; then
              echo "::warning::Variantbilder: ${vb_kvar} sidor kan ha fel bild i varukorgen — kör variantbild.yml med ids." >&2
            fi
            [ "${vb_avv}" = "0" ]
          }

          # Recensionerna till planens produkter: torr prövar, skriv skriver.
          # Besluten läses ur rundans recensioner.json (kort → produkt-id via
          # planen); saknas filen prövas produkterna utan beslut. Skriver bara
          # kort, recensions-id, skäl och antal, aldrig texterna.
          recensioner() {
            rfil="tools/polish-assets/${RUNDA}/recensioner.json"
            if [ -f "${rfil}" ]; then
              if ! jq -e 'type == "object"' "${rfil}" > /dev/null 2>&1; then
                echo "== recensioner: recensioner.json är inte ett objekt" >&2
                return 1
              fi
              beslut=$(jq -c --slurpfile p "${fil}" '
                ($p[0].produkter | map({(.kort): .pid}) | add) as $k
                | [to_entries[] | {productId: ($k[.key] // ("okänt kort " + .key)), oversatt: (.value.oversatt // {}), dolj: (.value.dolj // {})}]' "${rfil}")
            else
              beslut='[]'
            fi
            jq -c --arg l "$1" --argjson b "${beslut}" '{lage: $l, produkter: [.produkter[].pid], beslut: $b}' "${fil}" > rkropp.json
            rhttp=$(curl -sS --max-time 310 -o rsvar.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data-binary @rkropp.json \
              "${rot}/api/admin/polish-recensioner") || rhttp="000"
            if ! jq -e 'type == "object"' rsvar.json > /dev/null 2>&1; then
              echo "== recensioner ($1): HTTP ${rhttp}, svaret är inte JSON" >&2
              return 1
            fi
            # Felen bär produkt-id först; skriv kortet i stället.
            jq -r --slurpfile p "${fil}" '
              ($p[0].produkter | map({(.pid): .kort}) | add) as $k
              | (.fel // [])[] | . as $f | ($f | split("/")[0] | split(":")[0]) as $pid
              | "   recensioner FEL \($k[$pid] // $pid)\($f | sub("^[^/:]+"; ""))"' rsvar.json
            jq -r --slurpfile p "${fil}" '
              ($p[0].produkter | map({(.pid): .kort}) | add) as $k
              | (.produkter // [])[] | select(.oversatta + .dolda + .redan > 0 or (.avvikelser | length) > 0)
              | "   recensioner \($k[.productId] // "?"): översatta \(.oversatta), dolda \(.dolda), redan gjorda \(.redan)\(if (.avvikelser | length) > 0 then ", AVVIKELSER: " + (.avvikelser | join("; ")) else "" end)"' rsvar.json
            echo "== recensioner ($1, HTTP ${rhttp}): fel $(jq '(.fel // []) | length' rsvar.json), översatta $(jq '[(.produkter // [])[].oversatta] | add // 0' rsvar.json), dolda $(jq '[(.produkter // [])[].dolda] | add // 0' rsvar.json)"
            if [ "$1" = "skriv" ]; then
              jq -r '.butiken // empty | "   recensioner: butiken \(.uppdaterade) anrop ok, \(.misslyckade) föll, utan nyckel \(.utanNyckel)"' rsvar.json
              echo "Recensioner: översatta **$(jq '[(.produkter // [])[].oversatta] | add // 0' rsvar.json)**, dolda **$(jq '[(.produkter // [])[].dolda] | add // 0' rsvar.json)**, fel **$(jq '(.fel // []) | length' rsvar.json)**." >> "${GITHUB_STEP_SUMMARY}"
            fi
            [ "$(jq -r '.ok' rsvar.json)" = "true" ]
          }

          case "${LAGE}" in
            torr)
              # Alla fyra stegen körs även om ett faller, så varje problem syns på en gång.
              fel=0
              for s in text media kategorier sku; do steg "${s}" true || fel=1; done
              recensioner torr || fel=1
              exit "${fel}"
              ;;
            skriv)
              if ! recensioner torr; then
                echo "::error::Recensionerna saknar beslut eller faller i prövningen — ingenting skrivet. Runbookens steg 9: kör \"Polering — recensionerna till rundans produkter\" i läget las och skriv recensioner.json." >&2
                exit 1
              fi
              for s in text media kategorier sku; do
                if ! steg "${s}" false; then
                  echo "::error::Steget ${s} föll — stoppar här. Alla steg tål omkörning: rätta orsaken och kör läge skriv igen." >&2
                  exit 1
                fi
              done
              echo "Skrivet. Väntar 90 s innan den separata återläsningen."
              sleep 90
              # Variantbilderna rättas FÖRE återläsningen, så att den ser slutläget.
              variantbilder
              utfall=0
              verifiera_och_stampla || utfall=1
              if ! recensioner skriv; then
                echo "::error::Recensionerna skrevs inte (eller läste inte tillbaka). Produkterna är skrivna; kör läget stampla igen, eller \"Polering — recensionerna till rundans produkter\" i läget skriv." >&2
                utfall=1
              fi
              exit "${utfall}"
              ;;
            verifiera)
              steg verifiera true
              ;;
            stampla)
              utfall=0
              verifiera_och_stampla || utfall=1
              recensioner skriv || utfall=1
              exit "${utfall}"
              ;;
          esac
