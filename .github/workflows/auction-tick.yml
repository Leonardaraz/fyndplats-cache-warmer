name: Fyndauktion tick

# Pingar /api/cron/auction-tick: stegar auktionspriser nedåt, upptäcker köp
# (→ rotera in nästa produkt ur kön), återställer priser vid sold/expired.
# All logik ligger i appen — workflow:n är bara väckarklockan.
#
# ☠️ DET HÄR ÄR INTE TICKENS KLOCKA. Den är Vercels cron i vercel.json, var
# tionde minut sedan Black Week-delen (planens del C2). GitHub körde det här
# schemat 29 gånger på 122 timmar i stället för ~735 (uppmätt 24–29 oktober,
# docs/claude/39-orderpipelinen.md), så prissänkningarna hängde på Vercels
# timcron. Workflowen finns kvar av två skäl: en körning för hand
# (workflow_dispatch), och ett larm — de körningar GitHub ändå gör blir röda när
# ticket rapporterar ok:false. Ticken är idempotent, så en körning härifrån
# samtidigt som Vercels gör samma skrivningar en gång till och inget annat.
#
# Återanvänder befintlig repository secret:
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars
# (URL:en är inte hemlig — auth sker via Bearer-headern.)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auction-tick endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fyndplats-cache-warmer.vercel.app/api/cron/auction-tick")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned non-200 status"
            exit 1
          fi
          # ok:false = tick-fel per rad (t.ex. misslyckad PATCH) bakom HTTP 200.
          # Utan denna koll gick zombie-auktionerna obemärkta i veckor — kravet
          # är att körningen blir RÖD så felet syns i Actions-historiken.
          if echo "$body" | grep -q '"ok":false'; then
            echo "::error::Ticken rapporterade ok:false — se rapporten ovan"
            exit 1
          fi
