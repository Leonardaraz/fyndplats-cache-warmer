name: Fyndauktion tick

# Pingar /api/cron/auction-tick: stegar auktionspriser nedåt, upptäcker köp
# (→ rotera in nästa produkt ur kön), återställer priser vid sold/expired.
# All logik ligger i appen — workflow:n är bara väckarklockan.
#
# VAR 10:e MINUT, inte varje timme (audit 2026-08-14): GitHub Actions-cron
# driver 9–57 min (uppmätt: körningar 05:29, 03:57, 01:09 för "0 * * * *"),
# och Vercel-cronen i vercel.json täcker inte upp på hobby-planen. Med timvis
# schemaläggning landade prissänkningarna upp till en timme sena — kundernas
# nedräkning nådde noll utan att något hände och korten fastnade på "Priset
# uppdateras…". Ticken är idempotent och billig (PATCH:ar bara när målsteget
# ändrats), så tätare väckning kostar sekunder per körning och gör att varje
# sänkning landar minuter efter timslaget i stället för uppåt en timme.
#
# Återanvänder befintlig repository secret:
#   CRON_SECRET — samma värde som CRON_SECRET i Vercel env vars
# (URL:en är inte hemlig — auth sker via Bearer-headern.)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auction-tick endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fyndplats-cache-warmer.vercel.app/api/cron/auction-tick")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Endpoint returned non-200 status"
            exit 1
          fi
          # ok:false = tick-fel per rad (t.ex. misslyckad PATCH) bakom HTTP 200.
          # Utan denna koll gick zombie-auktionerna obemärkta i veckor — kravet
          # är att körningen blir RÖD så felet syns i Actions-historiken.
          if echo "$body" | grep -q '"ok":false'; then
            echo "::error::Ticken rapporterade ok:false — se rapporten ovan"
            exit 1
          fi
