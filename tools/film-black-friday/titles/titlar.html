<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Pristrappan – texter</title>
<style>
@font-face { font-family: 'Newsreader'; src: url('../assets/fonts/Newsreader-VF.ttf'); font-weight: 200 800; font-style: normal; }
@font-face { font-family: 'Newsreader'; src: url('../assets/fonts/Newsreader-Italic-VF.ttf'); font-weight: 200 800; font-style: italic; }
@font-face { font-family: 'Geist'; src: url('../assets/fonts/Geist-VF.ttf'); font-weight: 100 900; font-style: normal; }
:root { --kram: #FBF6EC; --guld: #D9A53E; --guld-ljus: #F5DA98; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: 'Geist', sans-serif; color: var(--kram); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-optical-sizing: auto; }
#scen { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
.skugga { position: absolute; left: 0; width: 1080px; pointer-events: none; opacity: 0; }
.block { position: absolute; left: 0; width: 1080px; text-align: center; opacity: 0; will-change: transform, opacity; }
.mask { display: block; overflow: hidden; padding: 0.08em 0.12em 0.16em; margin: -0.08em 0 -0.16em; }
.rad { display: inline-block; will-change: transform; }
.h { font-family: 'Newsreader', Georgia, serif; font-weight: 560; letter-spacing: -0.026em; line-height: 1.04; color: var(--kram);
     text-shadow: 0 2px 30px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.35); white-space: nowrap; }
.h em { font-style: italic; font-weight: 520; letter-spacing: -0.02em; padding-right: 0.06em;
        background: linear-gradient(100deg, #F8E3AE 0%, #E9BE62 46%, #D9A53E 100%); -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 2px 18px rgba(0,0,0,.5)); }
.ogon { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.22em; text-transform: uppercase; color: #E9BE62;
        text-shadow: 0 1px 18px rgba(0,0,0,.6); white-space: nowrap; padding-left: 0.22em; }
.ogon .streck { display: inline-block; width: 46px; height: 2px; background: #E9BE62; vertical-align: middle; margin: 0 20px 6px; opacity: .85; }
/* scen 4: raknaren */
#raknare { display: inline-flex; align-items: baseline; justify-content: center; }
#raknare .siffror { display: inline-flex; font-family: 'Newsreader', serif; font-weight: 600; font-size: 248px; line-height: 1; letter-spacing: -0.04em;
                    height: 1em; overflow: hidden; padding: 0 0.04em; }
#raknare .kol { display: inline-block; height: 1em; overflow: hidden; }
#raknare .remsa { display: flex; flex-direction: column; will-change: transform; }
#raknare .remsa span { display: block; height: 1em; line-height: 1;
                       background: linear-gradient(180deg, #FAE8B8 8%, #E9BE62 52%, #C98F2B 96%); -webkit-background-clip: text; background-clip: text;
                       color: transparent; -webkit-text-fill-color: transparent; }
#raknare .ord { font-family: 'Newsreader', serif; font-style: italic; font-weight: 520; font-size: 118px; letter-spacing: -0.02em; color: var(--kram);
                margin-left: 0.2em; text-shadow: 0 2px 30px rgba(0,0,0,.55); }
/* scen 6: slutbilden */
#marke { font-family: 'Geist', sans-serif; font-weight: 800; font-size: 128px; letter-spacing: -0.025em; line-height: 1; color: var(--kram);
         text-shadow: 0 2px 34px rgba(0,0,0,.6); }
#slutrad { font-family: 'Newsreader', serif; font-weight: 520; font-size: 56px; letter-spacing: -0.012em; line-height: 1.1; white-space: nowrap; }
#slutrad em { font-style: italic; background: linear-gradient(100deg, #F8E3AE 0%, #E9BE62 50%, #D9A53E 100%); -webkit-background-clip: text; background-clip: text;
              color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 16px rgba(0,0,0,.55)); }
#lank { display: inline-block; font-family: 'Geist', sans-serif; font-weight: 600; font-size: 44px; letter-spacing: -0.005em; color: var(--kram);
        padding: 17px 44px 19px; border-radius: 999px; border: 2.5px solid rgba(233,190,98,.9); background: rgba(8,6,4,.42);
        text-shadow: 0 1px 14px rgba(0,0,0,.5); white-space: nowrap; }
</style>
</head>
<body>
<div id="scen"></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const VARIANT = P.get('variant') || 'torsdag';   // 'torsdag' = dagen fore, 'fredag' = pa Black Friday
const ANTAL = parseInt(P.get('antal') || '100', 10);
const TXT = {
  dag: VARIANT === 'fredag' ? 'Black Friday <span class="streck"></span> i dag' : 'Black Friday <span class="streck"></span> fredag 27 november',
  slut: VARIANT === 'fredag' ? 'Fyndauktionen · <em>i dag till kl 19</em>' : 'Fyndauktionen · <em>fredag kl 07–19</em>',
};

const kl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const led = (t, a, b) => kl((t - a) / (b - a));
const utExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * kl(x)));
const utKub = (x) => 1 - Math.pow(1 - kl(x), 3);
const inKub = (x) => Math.pow(kl(x), 3);
const mjuk = (x) => { x = kl(x); return x * x * (3 - 2 * x); };
const utBack = (x, s = 1.4) => { x = kl(x); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

const scen = document.getElementById('scen');
function el(tagg, klass, html, stil) {
  const e = document.createElement(tagg);
  if (klass) e.className = klass;
  if (html != null) e.innerHTML = html;
  if (stil) Object.assign(e.style, stil);
  return e;
}

// ---- vanliga textblock: rader som glider upp ur en mask, en i taget
const BLOCK = [
  { id: 's1', in: 0.18, ut: 2.28, top: 296, glapp: 0.10, rader: [
      { ogon: 'Black Friday <span class="streck"></span> Fyndauktionen', ner: 30 },
      { h: 'Priset sjunker', px: 112 }, { h: '<em>varje timme.</em>', px: 112 } ] },
  { id: 's2a', in: 3.05, ut: 5.18, top: 300, glapp: 0.10, rader: [
      { h: 'Kl 07 startar varan', px: 84 }, { h: 'på <em>ordinarie pris.</em>', px: 84 } ] },
  { id: 's2b', in: 5.40, ut: 8.32, top: 300, glapp: 0.10, rader: [
      { h: 'Varje timme går priset', px: 84 }, { h: '<em>ner ett steg.</em>', px: 84 } ] },
  { id: 's3a', in: 8.72, ut: 10.36, top: 318, glapp: 0.08, skugga: [0, 760, 0.78], rader: [
      { h: '<em>Vågar du vänta?</em>', px: 122 } ] },
  { id: 's3b', in: 10.82, ut: 11.86, top: 304, glapp: 0.09, skugga: [0, 760, 0.78], rader: [
      { h: 'Varje fynd finns', px: 88 }, { h: '<em>bara en gång.</em>', px: 88 } ] },
  { id: 's4b', in: 14.02, ut: 17.72, top: 300, glapp: 0.08, rader: [
      { ogon: TXT.dag, ner: 14, px: 27 }, { h: `<em>${ANTAL} fynd</em> · start kl 07`, px: 60 } ] },
  { id: 's5', in: 18.12, ut: 20.86, top: 318, glapp: 0.08, rader: [
      { ogon: 'Tryggt köp på Fyndplats' } ] },
];

const dom = {};
for (const b of BLOCK) {
  if (b.skugga) {
    const s = el('div', 'skugga', null, { top: b.skugga[0] + 'px', height: b.skugga[1] + 'px',
      background: `linear-gradient(180deg, rgba(0,0,0,${b.skugga[2]}) 0%, rgba(0,0,0,${b.skugga[2] * 0.82}) 42%, rgba(0,0,0,0) 100%)` });
    scen.appendChild(s);
    b._skugga = s;
  }
  const blk = el('div', 'block', null, { top: b.top + 'px' });
  b._rader = [];
  for (const r of b.rader) {
    const mask = el('span', 'mask');
    const rad = el('span', r.ogon ? 'rad ogon' : 'rad h', r.ogon || r.h, r.px ? { fontSize: r.px + 'px' } : null);
    mask.appendChild(rad);
    const hall = el('div', null, null, r.ner ? { marginBottom: r.ner + 'px' } : null);
    hall.appendChild(mask);
    blk.appendChild(hall);
    b._rader.push(rad);
  }
  scen.appendChild(blk);
  dom[b.id] = blk;
}

// ---- scen 4: raknaren som rullar upp till antalet
const s4 = el('div', 'block', null, { top: '292px' });
const ogon4 = el('div', null, `<span class="mask"><span class="rad ogon" style="font-size:27px">${TXT.dag}</span></span>`, { marginBottom: '6px' });
const rk = el('div', null, null, { id: 'raknare' });
rk.id = 'raknare';
const siffror = el('span', 'siffror');
const SIFFROR = String(ANTAL).split('').map(Number);
const remsor = [];
SIFFROR.forEach((mal, i) => {
  const kol = el('span', 'kol');
  const remsa = el('span', 'remsa');
  // remsan visar 0..9 i flera varv och slutar pa malsiffran
  const varv = 1 + (SIFFROR.length - 1 - i);
  const lista = [];
  for (let v = 0; v < varv; v++) for (let d = 0; d < 10; d++) lista.push(d);
  for (let d = 0; d <= mal; d++) lista.push(d);
  if (i === 0 && SIFFROR.length > 1) lista.splice(0, lista.length, ...[0, ...Array.from({ length: mal }, (_, d) => d + 1)]);
  remsa.innerHTML = lista.map((d) => `<span>${d}</span>`).join('');
  kol.appendChild(remsa);
  siffror.appendChild(kol);
  remsor.push({ remsa, steg: lista.length - 1, kol, forst: i === 0 });
});
rk.appendChild(siffror);
rk.appendChild(el('span', 'ord', 'fynd'));
s4.appendChild(ogon4);
s4.appendChild(rk);
scen.appendChild(s4);

// ---- scen 6: slutbilden
const skugga6 = el('div', 'skugga', null, { top: '890px', height: '460px',
  background: 'radial-gradient(60% 50% at 50% 48%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.42) 55%, rgba(0,0,0,0) 100%)' });
scen.appendChild(skugga6);
const s6 = el('div', 'block', null, { top: '946px', opacity: 1 });
const m6 = el('div', null, '<span class="mask"><span class="rad" id="marke">Fyndplats</span></span>');
const r6 = el('div', null, `<span class="mask"><span class="rad" id="slutrad">${TXT.slut}</span></span>`, { marginTop: '12px' });
const l6 = el('div', null, '<span class="rad" id="lank">fyndplats.se/fyndauktion</span>', { marginTop: '26px' });
s6.append(m6, r6, l6);
scen.appendChild(s6);
const slut = { marke: m6.querySelector('.rad'), rad: r6.querySelector('.rad'), lank: l6.querySelector('.rad') };

const T_RAKNARE = [12.10, 13.50];   // rullar, landar pa slaget
const T_SLUT = 22.62;               // strax efter att kuben landat

window.satt = function (t) {
  for (const b of BLOCK) {
    const blk = dom[b.id];
    const ute = mjuk(led(t, b.ut, b.ut + 0.30));
    const synlig = t >= b.in - 0.02 && t <= b.ut + 0.32;
    blk.style.opacity = synlig ? String(1 - ute) : '0';
    blk.style.transform = `translateY(${-16 * ute}px)`;
    blk.style.filter = ute > 0 ? `blur(${5 * ute}px)` : 'none';
    b._rader.forEach((rad, i) => {
      const k = utExpo(led(t, b.in + i * b.glapp, b.in + i * b.glapp + 0.62));
      rad.style.transform = `translateY(${(1 - k) * 112}%)`;
      rad.style.opacity = String(kl(k * 3));
    });
    if (b._skugga) b._skugga.style.opacity = String(mjuk(led(t, b.in - 0.1, b.in + 0.35)) * (1 - mjuk(led(t, b.ut, b.ut + 0.35))));
  }
  // raknaren
  {
    const inne = t >= 12.02 && t <= 14.30;
    const ute = mjuk(led(t, 13.82, 14.10));
    s4.style.opacity = inne ? String(mjuk(led(t, 12.02, 12.22)) * (1 - ute)) : '0';
    const k = utKub(led(t, T_RAKNARE[0], T_RAKNARE[1]));
    const tau = t - T_RAKNARE[1];
    const studs = tau >= 0 ? 1 + 0.07 * Math.exp(-tau * 9) * Math.cos(tau * 20) : 1;
    s4.style.transform = `translateY(${-22 * ute}px) scale(${(0.96 + 0.04 * k) * studs * (1 - 0.06 * ute)})`;
    s4.style.transformOrigin = '50% 60%';
    s4.style.filter = ute > 0 ? `blur(${6 * ute}px)` : 'none';
    const og = ogon4.querySelector('.rad');
    const ko = utExpo(led(t, 12.25, 12.85));
    og.style.transform = `translateY(${(1 - ko) * 112}%)`;
    remsor.forEach((r) => {
      const pos = r.steg * k;
      r.remsa.style.transform = `translateY(${-pos}em)`;
      // forsta siffran (hundratalet) syns forst nar raknaren narmar sig hundra
      if (r.forst && SIFFROR.length > 2) {
        const v = mjuk(led(k, 0.80, 0.97));
        r.kol.style.width = (0.5 * v) + 'em';
        r.kol.style.opacity = String(v);
      }
    });
  }
  // slutbilden
  {
    const delar = [[slut.marke, 0.0, 'mask'], [slut.rad, 0.20, 'mask'], [slut.lank, 0.42, 'fri']];
    s6.style.opacity = t >= T_SLUT - 0.05 ? '1' : '0';
    for (const [e, d, typ] of delar) {
      const k = utExpo(led(t, T_SLUT + d, T_SLUT + d + 0.7));
      if (typ === 'mask') { e.style.transform = `translateY(${(1 - k) * 112}%)`; e.style.opacity = String(kl(k * 3)); }
      else { e.style.transform = `translateY(${(1 - k) * 26}px) scale(${0.96 + 0.04 * k})`; e.style.opacity = String(kl(k * 1.6)); }
    }
    skugga6.style.opacity = String(mjuk(led(t, T_SLUT - 0.1, T_SLUT + 0.5)));
  }
};
window.satt(0);
</script>
</body>
</html>
